<style>

<body>
<main>
  <div class="eyebrow">Sleep Pathways Guild</div>
  <h1>Free CPSGT Study Launchpad</h1>
  <p>Loading the complete CPSGT practice app with blueprint-aligned questions, flashcards, Math Coach, mock-style testing, equipment review, and progress reports.</p>
  <div class="spinner" id="spinner" aria-hidden="true"></div>
  <div class="status" id="status" role="status" aria-live="polite">Preparing your study tools…</div>
  <div class="error" id="error" role="alert"></div>
  <noscript><div class="error show">JavaScript is required for this interactive study app. Please enable JavaScript and reload the page.</div></noscript>
  <p class="fine">Your study progress is stored locally in your browser.</p>
</main>
<script>
(async function(){
  const status=document.getElementById('status');
  const error=document.getElementById('error');
  const spinner=document.getElementById('spinner');
  const packageVersion='20260729-2';

  function decodeBase64(value){
    const binary=atob(value.replace(/\s+/g,''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return bytes;
  }

  async function gunzip(bytes){
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }

  async function gunzipPackage(bytes){
    try{
      return await gunzip(bytes);
    }catch(primaryError){
      const candidates=[];
      for(let i=1;i<bytes.length-2;i++){
        if(bytes[i]===0x1f&&bytes[i+1]===0x8b&&bytes[i+2]===0x08) candidates.push(i);
      }
      for(const boundary of candidates){
        try{
          const first=await gunzip(bytes.slice(0,boundary));
          const rest=await gunzipPackage(bytes.slice(boundary));
          return first+rest;
        }catch(_ignored){
          // Continue until a valid gzip-member boundary is found.
        }
      }
      throw primaryError;
    }
  }

  try{
    if(typeof DecompressionStream==='undefined'){
      throw new Error('This browser does not support the secure decompression feature needed by the app. Please update Chrome, Edge, Firefox, or Safari and try again.');
    }
    const parts=['.cpsgt-upload/part-000.b64','.cpsgt-upload/part-001.b64'];
    status.textContent='Downloading the CPSGT learning library…';
    const responses=await Promise.all(parts.map(async path=>{
      const response=await fetch(path+'?v='+packageVersion,{cache:'no-store'});
      if(!response.ok) throw new Error('A required app file could not be loaded ('+response.status+').');
      return response.text();
    }));
    status.textContent='Opening the CPSGT Study Launchpad…';

    let html;
    try{
      const decodedParts=responses.map(decodeBase64);
      const individuallyCompressed=decodedParts.every(bytes=>bytes.length>3&&bytes[0]===0x1f&&bytes[1]===0x8b&&bytes[2]===0x08);
      if(individuallyCompressed){
        const sections=[];
        for(const bytes of decodedParts) sections.push(await gunzipPackage(bytes));
        html=sections.join('');
      }else{
        html=await gunzipPackage(decodeBase64(responses.join('')));
      }
    }catch(_partError){
      html=await gunzipPackage(decodeBase64(responses.join('')));
    }

    if(!/^\s*<!doctype html>/i.test(html)||!html.includes('CPSGT')){
      throw new Error('The downloaded app package did not pass its content check.');
    }
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    spinner.style.display='none';
    status.textContent='The study app could not be opened.';
    error.textContent=(err&&err.message)?err.message:'An unexpected loading error occurred. Please reload the page.';
    error.classList.add('show');
    console.error('CPSGT Study Launchpad loader error:',err);
  }
})();
</script>
