<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Loading RPSGT Study Trail | Sleep Pathways Guild</title>
  <style>
    :root{color-scheme:light;--blue:#1759a8;--teal:#178d8b;--ink:#172033;--muted:#5f6d7c;--line:#d6e0ee;--bg:#f4f7fb}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
    .card{width:min(92vw,560px);padding:28px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 16px 42px rgba(31,76,132,.14);text-align:center}
    .mark{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-size:26px;font-weight:900}
    h1{margin:0 0 10px;font-size:1.42rem;color:#12325f}p{margin:8px 0;line-height:1.55;color:var(--muted)}
    .bar{height:10px;margin:20px 0 10px;border-radius:999px;background:#e7eef8;overflow:hidden}.fill{height:100%;width:4%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .25s ease}
    .status{min-height:1.5em;font-size:.92rem;font-weight:700;color:#40536b}.error{display:none;margin-top:18px;padding:14px;border:1px solid #efc3c3;border-radius:14px;background:#fff5f5;color:#792626;text-align:left;line-height:1.5}.error.show{display:block}
    button,a.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin:12px 5px 0;padding:0 16px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}
    a.secondary{background:#eef3fa;color:#244569;border:1px solid var(--line)}
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">SP</div>
    <h1>Loading the RPSGT Study Trail</h1>
    <p>The full study app is being verified before it opens.</p>
    <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Preparing secure study files…</div>
    <div class="error" id="error"></div>
  </main>
<script>
(() => {
  'use strict';
  const REPOSITORY = 'Fishingcoder2/Sleeppathewaysguild';
  const ORIGINAL_URL = `https://raw.githubusercontent.com/${REPOSITORY}/rpsgt-pre-repair-20260725/RPSGTv2.2026-core.html`;
  const PATCH_BASE = `https://raw.githubusercontent.com/${REPOSITORY}/main/.deploy/rpsgt-repair`;
  const PATCH_URLS = Array.from({length: 11}, (_, i) => `${PATCH_BASE}/part-${String(i + 1).padStart(3, '0')}.b64`);
  const EXPECTED_ORIGINAL_SIZE = 11734470;
  const EXPECTED_TARGET_SIZE = 11441217;
  const EXPECTED_TARGET_SHA256 = '2508815dde8c2b278b25708ff2328e8203afc065fb6493550b4d0fca71b3c0ae';
  const BASE85 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+-;<=>?@^_`{|}~';
  const BASE85_MAP = new Map(Array.from(BASE85, (char, index) => [char, index]));
  const statusNode = document.getElementById('status');
  const fillNode = document.getElementById('fill');
  const errorNode = document.getElementById('error');

  function setProgress(percent, message) {
    fillNode.style.width = `${Math.max(4, Math.min(100, percent))}%`;
    statusNode.textContent = message;
  }

  async function fetchBytes(url) {
    const response = await fetch(url, {cache: 'no-store', mode: 'cors'});
    if (!response.ok) throw new Error(`Could not retrieve a required study file (${response.status}).`);
    return new Uint8Array(await response.arrayBuffer());
  }

  async function fetchText(url) {
    const response = await fetch(url, {cache: 'no-store', mode: 'cors'});
    if (!response.ok) throw new Error(`Could not retrieve a required repair file (${response.status}).`);
    return response.text();
  }

  function base64ToBytes(base64) {
    const clean = base64.replace(/\s+/g, '');
    const binary = atob(clean);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function decompress(bytes, format) {
    if (typeof DecompressionStream !== 'function') {
      throw new Error('This browser is too old to open the current study app securely. Please update the browser and try again.');
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  function decodeGitBase85(lines) {
    const chunks = [];
    let total = 0;
    for (const line of lines) {
      if (!line) continue;
      const prefix = line.charCodeAt(0);
      let decodedLength;
      if (prefix >= 65 && prefix <= 90) decodedLength = prefix - 64;
      else if (prefix >= 97 && prefix <= 122) decodedLength = prefix - 70;
      else throw new Error('The repair file has an invalid line-length marker.');
      const encoded = line.slice(1);
      if (encoded.length % 5 !== 0) throw new Error('The repair file has an invalid base85 block.');
      const row = new Uint8Array((encoded.length / 5) * 4);
      let rowPosition = 0;
      for (let i = 0; i < encoded.length; i += 5) {
        let value = 0;
        for (let j = 0; j < 5; j += 1) {
          const digit = BASE85_MAP.get(encoded[i + j]);
          if (digit === undefined) throw new Error('The repair file contains an invalid base85 character.');
          value = value * 85 + digit;
        }
        row[rowPosition++] = (value >>> 24) & 0xff;
        row[rowPosition++] = (value >>> 16) & 0xff;
        row[rowPosition++] = (value >>> 8) & 0xff;
        row[rowPosition++] = value & 0xff;
      }
      const trimmed = row.subarray(0, decodedLength);
      chunks.push(trimmed);
      total += trimmed.length;
    }
    const result = new Uint8Array(total);
    let position = 0;
    for (const chunk of chunks) {
      result.set(chunk, position);
      position += chunk.length;
    }
    return result;
  }

  function readVariableInteger(bytes, state) {
    let value = 0;
    let shift = 0;
    while (true) {
      if (state.position >= bytes.length || shift > 49) throw new Error('The repair delta is incomplete.');
      const byte = bytes[state.position++];
      value += (byte & 0x7f) * (2 ** shift);
      if ((byte & 0x80) === 0) return value;
      shift += 7;
    }
  }

  function applyGitDelta(source, delta) {
    const state = {position: 0};
    const sourceSize = readVariableInteger(delta, state);
    const targetSize = readVariableInteger(delta, state);
    if (sourceSize !== source.length) throw new Error('The preserved source does not match this repair.');
    if (targetSize !== EXPECTED_TARGET_SIZE) throw new Error('The repair declared an unexpected output size.');
    const target = new Uint8Array(targetSize);
    let outputPosition = 0;
    while (state.position < delta.length) {
      const command = delta[state.position++];
      if (command & 0x80) {
        let offset = 0;
        let size = 0;
        if (command & 0x01) offset += delta[state.position++];
        if (command & 0x02) offset += delta[state.position++] * 0x100;
        if (command & 0x04) offset += delta[state.position++] * 0x10000;
        if (command & 0x08) offset += delta[state.position++] * 0x1000000;
        if (command & 0x10) size += delta[state.position++];
        if (command & 0x20) size += delta[state.position++] * 0x100;
        if (command & 0x40) size += delta[state.position++] * 0x10000;
        if (size === 0) size = 0x10000;
        if (offset < 0 || size < 0 || offset + size > source.length || outputPosition + size > target.length) throw new Error('The repair contains an invalid copy instruction.');
        target.set(source.subarray(offset, offset + size), outputPosition);
        outputPosition += size;
      } else if (command > 0) {
        if (state.position + command > delta.length || outputPosition + command > target.length) throw new Error('The repair contains an invalid insert instruction.');
        target.set(delta.subarray(state.position, state.position + command), outputPosition);
        state.position += command;
        outputPosition += command;
      } else throw new Error('The repair contains an invalid zero instruction.');
    }
    if (outputPosition !== target.length) throw new Error('The repaired app did not reach its expected size.');
    return target;
  }

  async function sha256Hex(bytes) {
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
  }

  function extractForwardDelta(patchText) {
    const lines = patchText.replace(/\r\n/g, '\n').split('\n');
    const marker = lines.indexOf('GIT binary patch');
    if (marker < 0 || !/^delta \d+$/.test(lines[marker + 1] || '')) throw new Error('The repair file does not contain the expected forward delta.');
    const encodedLines = [];
    for (let i = marker + 2; i < lines.length && lines[i] !== ''; i += 1) encodedLines.push(lines[i]);
    if (!encodedLines.length) throw new Error('The repair delta is empty.');
    return encodedLines;
  }

  async function loadVerifiedApp() {
    setProgress(8, 'Downloading the preserved study app…');
    const sourcePromise = fetchBytes(ORIGINAL_URL);
    setProgress(14, 'Downloading the verified repair package…');
    const patchPartsPromise = Promise.all(PATCH_URLS.map(fetchText));
    const [source, patchParts] = await Promise.all([sourcePromise, patchPartsPromise]);
    if (source.length !== EXPECTED_ORIGINAL_SIZE) throw new Error('The preserved source has an unexpected size.');
    setProgress(38, 'Opening the repair package…');
    const compressedPatch = base64ToBytes(patchParts.join(''));
    const patchBytes = await decompress(compressedPatch, 'gzip');
    const patchText = new TextDecoder('utf-8', {fatal: true}).decode(patchBytes);
    setProgress(55, 'Reconstructing the repaired study app…');
    const encodedDelta = extractForwardDelta(patchText);
    const compressedDelta = decodeGitBase85(encodedDelta);
    const delta = await decompress(compressedDelta, 'deflate');
    const repaired = applyGitDelta(source, delta);
    setProgress(82, 'Verifying the repaired app…');
    const digest = await sha256Hex(repaired);
    if (digest !== EXPECTED_TARGET_SHA256) throw new Error('The repaired app did not pass its integrity check.');
    const html = new TextDecoder('utf-8', {fatal: true}).decode(repaired);
    if (!/<!doctype html/i.test(html) || !html.includes('id="app-data"') || !html.includes('RPSGT Study Trail') || !html.includes('</html>')) throw new Error('The repaired app did not pass its structural check.');
    setProgress(100, 'Verified. Opening your study dashboard…');
    await new Promise(resolve => setTimeout(resolve, 60));
    document.open('text/html', 'replace');
    document.write(html);
    document.close();
  }

  loadVerifiedApp().catch(error => {
    console.error('RPSGT verified loader failed:', error);
    setProgress(100, 'The study app could not be opened.');
    errorNode.classList.add('show');
    errorNode.innerHTML = `<strong>Loading stopped safely.</strong><br>${String(error && error.message ? error.message : error)}<br>` +
      '<button type="button" id="retryButton">Try again</button>' +
      '<a class="button secondary" href="https://sleeppathwaysguild.com/">Return to the Guild</a>';
    document.getElementById('retryButton').addEventListener('click', () => location.reload());
  });
})();
</script>
</body>
</html>
