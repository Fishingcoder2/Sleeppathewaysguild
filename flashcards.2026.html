<style>
:root { 
  /* Brand specific */
  --brand-bg: #07111d;
  --brand-bg2: #0d1d34;
  --brand-text: #f4f8ff;
  --brand-muted: #c4d3e8;
  --brand-line: rgba(255,255,255,.12);
  --brand-panel: rgba(255,255,255,.08);
  --brand-blue: #1f6fbf;
  --brand-teal: #2fb7b0;
  --brand-gold: #c8903b;

  /* Card specific */
  --card-bg: #ffffff; 
  --card-text: #17304f; 
  --line: #d8e3f2; 
  --ekgPaper: #fffcfc; 
  --ekgMinor: #fecdd3; 
  --ekgMajor: #fda4af; 
  --psgGrid: #e2e8f0; 
}
* { box-sizing:border-box; }
body { 
  margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; 
  background:linear-gradient(135deg,var(--brand-bg),var(--brand-bg2)); color:var(--brand-text); 
  min-height: 100vh; display: flex; flex-direction: column;
}
.shell { max-width:1000px; margin:0 auto; padding:24px 18px; flex: 1; width: 100%; display: flex; flex-direction: column;}

/* Header Elements */
.header-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--brand-line); padding-bottom: 20px;}
.header-titles { display: flex; flex-direction: column; gap: 4px; }
.header-titles h1 { margin: 0; font-size: 28px; color: var(--brand-gold); font-weight: 700; letter-spacing: -0.5px;}
.header-titles h2 { margin: 0; font-size: 16px; color: var(--brand-muted); font-weight: 400; }
.nav-group { display: flex; gap: 8px; flex-wrap: wrap; }
.brand-btn { background: var(--brand-panel); color: var(--brand-text); border: 1px solid var(--brand-line); padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.brand-btn:hover { background: rgba(255,255,255,0.15); border-color: var(--brand-gold); color: var(--brand-gold); }

/* Category Selector */
.deck-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;}
.category-select { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--brand-teal); background: var(--brand-bg2); color: var(--brand-text); font-size: 16px; font-weight: 600; outline: none; cursor: pointer;}
.category-select:focus { box-shadow: 0 0 0 2px rgba(47,183,176,0.3); }
.card-counter { font-size: 15px; color: var(--brand-muted); font-weight: 600; background: var(--brand-panel); padding: 6px 12px; border-radius: 20px;}

/* 3D Flashcard Container */
.flashcard-container {
  perspective: 1000px;
  width: 100%;
  flex: 1;
  min-height: 400px;
  display: flex;
  flex-direction: column;
  margin-bottom: 24px;
}
.flashcard-inner {
  position: relative; width: 100%; height: 100%; flex: 1;
  text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d; cursor: pointer;
}
.flashcard-inner.is-flipped { transform: rotateY(180deg); }

/* Card Faces */
.flashcard-front, .flashcard-back {
  position: absolute; width: 100%; height: 100%; top: 0; left: 0;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  background: var(--card-bg); border-radius: 20px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.25); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px; color: var(--card-text); overflow: hidden;
}
.flashcard-back {
  transform: rotateY(180deg);
  background: linear-gradient(135deg, #ffffff, #f8fafc);
  border: 2px solid var(--brand-teal);
}

/* Card Content Typography */
.card-label { position: absolute; top: 20px; left: 24px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;}
.card-question { font-size: 24px; font-weight: 600; line-height: 1.4; max-width: 800px; }
.card-answer { font-size: 32px; font-weight: 700; color: var(--brand-teal); margin-bottom: 16px; }
.card-details { font-size: 18px; color: var(--muted); line-height: 1.5; max-width: 800px; }
.flip-hint { position: absolute; bottom: 20px; right: 24px; font-size: 13px; font-weight: 600; color: var(--brand-gold); animation: pulse 2s infinite; }

/* Visual Simulator Embeds */
.visual-embed { width: 100%; max-width: 900px; background: var(--ekgPaper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: inset 0 2px 10px rgba(0,0,0,0.05); position: relative; margin-top: 16px;}
.visual-label { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; font-weight: bold; z-index: 10; border: 1px solid var(--line);}
svg.canvas-area { display: block; width: 100%; }

/* Navigation Controls */
.controls-bar { display: flex; justify-content: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;}
.ctrl-btn {
  background: var(--brand-blue); color: #fff; border: none; padding: 14px 24px;
  border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(31, 111, 191, 0.3);
}
.ctrl-btn:hover { background: #2a8ae6; transform: translateY(-2px); }
.ctrl-btn.secondary { background: var(--brand-panel); color: var(--brand-text); box-shadow: none; border: 1px solid var(--brand-line); }
.ctrl-btn.secondary:hover { background: rgba(255,255,255,0.15); }

@keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
</style>

<div class="shell">
  <header class="header-bar">
    <div class="header-titles">
      <h1>Sleep Pathways Guild</h1>

    </div>
    <div class="nav-group">
      <a href="https://sleeppathwaysguild.com/" class="brand-btn">Guild Home</a>

    </div>
  </header>

  <div class="deck-controls">
    <select id="deckSelector" class="category-select" onchange="loadDeck()">
      <option value="ekg_visual">Visuals: EKG Rhythm Identification</option>

      <div class="flashcard-front">
        <div class="card-label" id="frontLabel">Question</div>

    </div>

  <div class="controls-bar">
    <button class="ctrl-btn secondary" onclick="prevCard()">← Previous</button>

    <button class="ctrl-btn" onclick="nextCard()">Next Card →</button>
  </div>

<script>
// --- PROCEDURAL GENERATORS ---

// 1. EKG Generator
function getEKGSVG(type) {
    let width = 1000, height = 240, path = `M 0 ${height/2}`, baseline = height/2;
    let beats = [], pBeats = [];
    let bpm = 72;
    if(type === 'bradycardia') bpm = 42; if(type === 'tachycardia') bpm = 125;
    if(type === 'svt') bpm = 180; if(type === 'vtach') bpm = 160;
    if(type === 'aflutter') bpm = 75; if(type === 'junctional') bpm = 48;
    if(type === 'idioventricular') bpm = 32; if(type === 'bbb') bpm = 68;
    if(type === 'mobitz2') bpm = 75; if(type === 'vfib' || type === 'asystole') bpm = 0; 

    if (type === 'third_degree') {
        let pInterval = (60/75)*100, vInterval = (60/35)*100;
        for(let i=pInterval*0.2; i<width; i+=pInterval) pBeats.push(i);
        for(let i=vInterval*0.5; i<width; i+=vInterval) beats.push(i);
    } else if (bpm > 0 && type !== 'vtach') {
        let interval = (60/bpm) * 100, curr = interval * 0.2, bCount = 0;
        while(curr < width) {
            beats.push(curr);
            if (type === 'afib') curr += interval * (0.6 + Math.random() * 0.8);
            else if (type === 'pvc' && beats.length === 3) curr += interval * 0.55; 
            else if (type === 'pvc_bigeminy') curr += (bCount % 2 === 0) ? interval * 0.65 : interval * 1.35;
            else if (type === 'sinus_pause' && beats.length === 3) curr += interval * 3.5;
            else if (type === 'sinus_arrhythmia') curr += interval + Math.sin(curr * 0.006) * 35; 
            else curr += interval;
            bCount++;
        }
    }

    for(let x = 0; x <= width; x++) {
        let y = baseline + Math.sin(x*0.005)*4 + Math.sin(x*0.011)*2; 
        if (type === 'asystole') { y += (Math.random()-0.5)*1.5; } 
        else if (type === 'vfib') { y += Math.sin(x*0.15)*35*Math.random() + Math.cos(x*0.05)*20; } 
        else if (type === 'vtach') { y -= Math.sin(x/((60/160)*100) * Math.PI * 2) * 45 + (Math.random()-0.5)*2; } 
        else {
            let minD = 9999, bIdx = -1;
            for(let i=0; i<beats.length; i++) if(Math.abs(x-beats[i]) < Math.abs(minD)) { minD = x-beats[i]; bIdx = i; }
            let noise = (Math.random()-0.5)*1.2;
            if(type === 'afib' && (minD < -10 || minD > 40)) noise += Math.sin(x*0.3)*3 + Math.sin(x*0.7)*2 + Math.random()*2;
            if(type === 'aflutter' && (minD < -15 || minD > 40)) noise += Math.sin(x/16 * Math.PI * 2) * -7 + Math.cos(x/8 * Math.PI) * 2; 

            if (type === 'third_degree') {
                let minP = 9999;
                for(let i=0; i<pBeats.length; i++) if(Math.abs(x-pBeats[i]) < Math.abs(minP)) minP = x-pBeats[i];
                if (minP > -15 && minP <= 0) y -= Math.sin((minP+15)/15*Math.PI)*6.5;
            }

            let isPVC = (type === 'pvc' && bIdx === 3) || (type === 'pvc_bigeminy' && bIdx % 2 === 1);
            let skipP = (type === 'afib' || type === 'aflutter' || type === 'junctional' || type === 'idioventricular' || type === 'third_degree' || isPVC);
            let isWide = (type === 'idioventricular' || type === 'bbb' || isPVC);
            let isDroppedBeat = (type === '2nddegree_type1' && (bIdx % 4) === 3) || (type === 'mobitz2' && (bIdx % 4) === 3);
            let prOffset = -25;
            if (type === '1stdegree') prOffset = -45;
            if (type === '2nddegree_type1') prOffset = [-25, -40, -60, -25][bIdx % 4];

            if(Math.abs(minD) < 70) {
                if(!skipP && minD > prOffset && minD <= prOffset+15) y -= Math.sin((minD-prOffset)/15*Math.PI)*6.5;
                if (!isDroppedBeat) {
                    if (isWide) {
                        if (type === 'bbb') {
                            if(minD > -8 && minD <= -4) y -= 35; else if(minD > -4 && minD <= 0) y += 15; else if(minD > 0 && minD <= 4) y -= 45; else if(minD > 4 && minD <= 8) y += 20; else if(minD > 8 && minD <= 12) y -= 5;
                        } else {
                            if(minD > -20 && minD <= 0) y -= (minD+20)*2.5; else if(minD > 0 && minD <= 25) y += 50 - (minD*2); else if(minD > 25 && minD <= 55) y += Math.sin((minD-25)/30*Math.PI)*20; 
                        }
                    } else {
                        if(minD > -5 && minD <= -2) y += 4; else if(minD > -2 && minD <= 0) y -= 55; else if(minD > 0 && minD <= 2) y += 15; else if(minD > 2 && minD <= 5) y -= 5; 
                        else if(minD > 15 && minD <= 35) y -= Math.sin((minD-15)/20*Math.PI)*11;
                    }
                }
            }
            y += noise;
        }
        path += ` L ${x} ${y.toFixed(1)}`;
    }
    
    return `
      <div class="visual-label">Lead II (10s)</div>
      <svg viewBox="0 0 1000 240" class="canvas-area">
        <defs>
            <pattern id="grid-minor" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="none" stroke="var(--ekgMinor)" stroke-width="0.5" /></pattern>
            <pattern id="grid-major" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="url(#grid-minor)" /><rect width="20" height="20" fill="none" stroke="var(--ekgMajor)" stroke-width="1" /></pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid-major)" />
        <path d="${path}" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="drop-shadow(0px 1px 1px rgba(0,0,0,0.15))"/>
      </svg>`;
}

// 2. PSG Generator
function getPSGSVG(type) {
    let width = 1000;
    let paths = { eogL: `M 0 `, eogR: `M 0 `, eeg: `M 0 `, emg: `M 0 ` };
    let offsets = { eogL: 50, eogR: 120, eeg: 220, emg: 330 };

    for (let x = 0; x <= width; x++) {
        let t = x / (1000/30);
        let lamf = Math.sin(t * 5 * Math.PI * 2) * 5 + Math.sin(t * 6 * Math.PI * 2) * 4 + Math.sin(t * 2.5 * Math.PI * 2) * 3;
        
        ['eogL', 'eogR', 'eeg', 'emg'].forEach(ch => {
            let y = 0;
            let noise = (Math.random() - 0.5) * 4;

            if (type === 'W') {
                if (ch === 'eeg') y = Math.sin(t * 10 * Math.PI * 2) * 15 + noise; 
                if (ch === 'emg') y = (Math.random() - 0.5) * 25; 
                if (ch === 'eogL' || ch === 'eogR') {
                    y = noise;
                    if (t > 5 && t < 5.3) y += Math.sin((t-5)/0.3 * Math.PI) * (ch==='eogL'? -35 : 35);
                    if (t > 18 && t < 18.3) y += Math.sin((t-18)/0.3 * Math.PI) * (ch==='eogL'? -30 : 30);
                }
            } else if (type === 'N1') {
                if (ch === 'eeg') {
                    y = lamf + noise;
                    if (t > 15 && t < 15.4) { let vTime = (t-15)/0.4; y += Math.sin(vTime * Math.PI * 2) * -30 * Math.exp(-Math.pow(vTime-0.5, 2)*20); }
                }
                if (ch === 'emg') y = (Math.random() - 0.5) * 10;
                if (ch === 'eogL') y = Math.sin(t * 0.3 * Math.PI * 2) * 15 + noise*0.5; 
                if (ch === 'eogR') y = -Math.sin(t * 0.3 * Math.PI * 2) * 15 + noise*0.5;
            } else if (type === 'N2') {
                if (ch === 'eeg') {
                    y = lamf * 0.8 + noise;
                    if (t > 6 && t < 7) { let env = Math.sin((t-6) * Math.PI); y += Math.sin(t * 13 * Math.PI * 2) * 25 * env; }
                    if (t > 24 && t < 24.8) { let env = Math.sin((t-24)/0.8 * Math.PI); y += Math.sin(t * 14 * Math.PI * 2) * 22 * env; }
                    if (t > 14 && t < 15) { let kTime = (t-14); if (kTime < 0.2) y += (kTime/0.2) * -60; else if (kTime < 0.6) y += (-60 + ((kTime-0.2)/0.4)*100); else y += (40 - ((kTime-0.6)/0.4)*40); }
                }
                if (ch === 'emg') y = (Math.random() - 0.5) * 6;
                if (ch === 'eogL' || ch === 'eogR') y = noise;
            } else if (type === 'N3') {
                if (ch === 'eeg') y = Math.sin(t * 1.1 * Math.PI * 2) * 35 + Math.sin(t * 0.6 * Math.PI * 2) * 25 + lamf*0.5 + noise;
                if (ch === 'emg') y = (Math.random() - 0.5) * 4;
                if (ch === 'eogL' || ch === 'eogR') y = (Math.sin(t * 1.1 * Math.PI * 2) * 10 + Math.sin(t * 0.6 * Math.PI * 2) * 8) + noise;
            } else if (type === 'R') {
                if (ch === 'eeg') {
                    y = lamf + noise;
                    if (t > 9 && t < 11) { let saw = (t * 4) % 1; y += (saw * 20 - 10); }
                }
                if (ch === 'emg') y = (Math.random() - 0.5) * 2; 
                if (ch === 'eogL' || ch === 'eogR') {
                    y = noise * 0.5;
                    let dir = ch === 'eogL' ? -1 : 1;
                    if (t>11.2 && t<11.5) y += Math.sin((t-11.2)/0.3 * Math.PI) * 40 * dir;
                    if (t>11.8 && t<12.0) y += Math.sin((t-11.8)/0.2 * Math.PI) * -35 * dir;
                    if (t>12.2 && t<12.6) y += Math.sin((t-12.2)/0.4 * Math.PI) * 45 * dir;
                }
            }
            paths[ch] += ` L ${x} ${(offsets[ch] + y).toFixed(1)}`;
        });
    }

    return `
      <div style="position:absolute; top:0; left:0; width:60px; height:100%; background:rgba(255,255,255,0.9); border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:space-around; font-family:monospace; font-size:11px; font-weight:bold; padding-left:8px; z-index:10;">
        <div style="color:#1d4ed8">EOG L</div><div style="color:#1d4ed8">EOG R</div><div style="color:#0f172a">EEG C4</div><div style="color:#b91c1c">Chin</div>
      </div>
      <div class="visual-label" style="left:auto; right:8px; background:transparent; border:none; color:var(--muted);">30-sec Epoch</div>
      <svg viewBox="0 0 1000 400" class="canvas-area" style="margin-left:60px; width:calc(100% - 60px);">
        <defs><pattern id="grid-psg" width="33.33" height="400" patternUnits="userSpaceOnUse"><rect width="33.33" height="400" fill="none" stroke="var(--psgGrid)" stroke-width="1" /></pattern></defs>
        <rect width="100%" height="100%" fill="url(#grid-psg)" />
        <path d="${paths.eogL}" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-linejoin="round" />
        <path d="${paths.eogR}" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-linejoin="round" />
        <path d="${paths.eeg}" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />
        <path d="${paths.emg}" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-linejoin="round" />
      </svg>`;
}


// --- FLASHCARD DATABASE ---
const DECKS = {
  ekg_visual: [
    { type: 'visual', gen: 'ekg', val: 'nsr', q: "Identify the Rhythm", a: "Normal Sinus Rhythm", d: "Regular rhythm, rate 60-100 bpm. Every P wave is followed by a normal QRS complex, PR interval is normal." },
    { type: 'visual', gen: 'ekg', val: 'bradycardia', q: "Identify the Rhythm", a: "Sinus Bradycardia", d: "Regular rhythm, rate < 60 bpm. Identical to NSR but slower." },
    { type: 'visual', gen: 'ekg', val: 'tachycardia', q: "Identify the Rhythm", a: "Sinus Tachycardia", d: "Regular rhythm, rate > 100 bpm. Normal P, PR, and QRS." },
    { type: 'visual', gen: 'ekg', val: 'sinus_pause', q: "Identify the Rhythm", a: "Sinus Pause", d: "Sudden failure of the SA node to initiate an impulse, creating a long visible pause (> 3 sec = asystole)." },
    { type: 'visual', gen: 'ekg', val: 'afib', q: "Identify the Rhythm", a: "Atrial Fibrillation", d: "Irregularly irregular rhythm. Absent distinct P waves, replaced by a fibrillatory (squiggly) baseline." },
    { type: 'visual', gen: 'ekg', val: 'aflutter', q: "Identify the Rhythm", a: "Atrial Flutter", d: "Continuous 'sawtooth' or 'picket fence' pattern of flutter waves instead of standard P waves." },
    { type: 'visual', gen: 'ekg', val: 'bbb', q: "Identify the Rhythm", a: "Bundle Branch Block", d: "Underlying rhythm is normal, but QRS complex is widened (>0.12s), often notched or looking like 'rabbit ears'." },
    { type: 'visual', gen: 'ekg', val: 'vtach', q: "Identify the Rhythm", a: "Ventricular Tachycardia", d: "Wide, fast, bizarre QRS complexes >100 bpm. Often resembles continuous mountains." },
    { type: 'visual', gen: 'ekg', val: 'vfib', q: "Identify the Rhythm", a: "Ventricular Fibrillation", d: "Chaotic, bizarre electrical activity with no identifiable P, QRS, or T waves. A medical emergency." },
    { type: 'visual', gen: 'ekg', val: 'pvc_bigeminy', q: "Identify the Rhythm", a: "PVC (Bigeminy)", d: "A regular alternating pattern: one normal beat immediately followed by one Premature Ventricular Contraction." },
    { type: 'visual', gen: 'ekg', val: '2nddegree_type1', q: "Identify the Rhythm", a: "2nd Degree AV Block (Wenckebach)", d: "Progressively lengthening PR interval beat-by-beat until a QRS is entirely dropped." },
    { type: 'visual', gen: 'ekg', val: 'third_degree', q: "Identify the Rhythm", a: "3rd Degree (Complete) AV Block", d: "Atria and ventricles beat completely independently. P waves march through the QRS indiscriminately." }
  ],
  psg_visual: [
    { type: 'visual', gen: 'psg', val: 'W', q: "Score this Epoch", a: "Stage W (Wake)", d: "Alpha rhythm (8-13 Hz) present >50% of the epoch. Eye blinks and high chin EMG tone." },
    { type: 'visual', gen: 'psg', val: 'N1', q: "Score this Epoch", a: "Stage N1", d: "Alpha replaced by Low Amplitude Mixed Frequency (LAMF). Slow Eye Movements (SEMs) and Vertex waves present." },
    { type: 'visual', gen: 'psg', val: 'N2', q: "Score this Epoch", a: "Stage N2", d: "Presence of Sleep Spindles (11-16 Hz) and/or K-Complexes (≥0.5s duration) on a LAMF background." },
    { type: 'visual', gen: 'psg', val: 'N3', q: "Score this Epoch", a: "Stage N3", d: "Slow wave activity (0.5-2 Hz, >75 µV) taking up ≥20% of the epoch. EOG is generally quiet or picks up Delta bleed." },
    { type: 'visual', gen: 'psg', val: 'R', q: "Score this Epoch", a: "Stage R (REM)", d: "LAMF EEG with sawtooth waves. Rapid Eye Movements (REMs) present. Chin EMG tone is at its lowest (atonia)." }
  ],
  cardiac_rules: [

// --- APP STATE & LOGIC ---
let currentDeck = [];
let currentIndex = 0;
let isFlipped = false;

function loadDeck() {
    const sel = document.getElementById('deckSelector').value;
    currentDeck = [...DECKS[sel]]; // clone
    currentIndex = 0;
    if (isFlipped) flipCard(true); // reset flip silently
    renderCard();
}

function shuffleDeck() {
    for (let i = currentDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
    }
    currentIndex = 0;
    if (isFlipped) flipCard(true);
    renderCard();
}

function renderCard() {
    const card = currentDeck[currentIndex];
    
    // Update Counter
    document.getElementById('cardCounter').innerText = `Card ${currentIndex + 1} / ${currentDeck.length}`;
    
    // UI Elements
    const qText = document.getElementById('frontText');
    const qVisual = document.getElementById('frontVisual');
    const aText = document.getElementById('backAnswer');
    const aDetails = document.getElementById('backDetails');

    // Populate Back
    aText.innerText = card.a;
    aDetails.innerText = card.d;

    // Populate Front based on type
    if (card.type === 'visual') {
        qText.style.display = 'none';
        qVisual.style.display = 'block';
        if (card.gen === 'ekg') qVisual.innerHTML = getEKGSVG(card.val);
        if (card.gen === 'psg') qVisual.innerHTML = getPSGSVG(card.val);
    } else {
        qVisual.style.display = 'none';
        qText.style.display = 'block';
        qText.innerText = card.q;
    }
}

function flipCard(forceUnflip = false) {
    const el = document.getElementById('flashcard');
    if (forceUnflip) {
        el.classList.remove('is-flipped');
        isFlipped = false;
    } else {
        el.classList.toggle('is-flipped');
        isFlipped = !isFlipped;
    }
}

function nextCard() {
    if (isFlipped) flipCard(true);
    setTimeout(() => {
        currentIndex = (currentIndex + 1) % currentDeck.length;
        renderCard();
    }, isFlipped ? 200 : 0); // Wait for flip animation if needed
}

function prevCard() {
    if (isFlipped) flipCard(true);
    setTimeout(() => {
        currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
        renderCard();
    }, isFlipped ? 200 : 0);
}

// Init
window.onload = loadDeck;
</script>
