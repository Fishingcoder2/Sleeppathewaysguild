<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RPSGT Study Trail | Sleep Pathways Guild</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f7fb}
    #rpsgtApp{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
    .fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;color:#172033;background:#f4f7fb;text-align:center}
    .fallback a{color:#1f5fbf;font-weight:800}
  </style>
</head>
<body>
  <iframe id="rpsgtApp" title="Sleep Pathways Guild RPSGT Study Trail" allow="fullscreen; clipboard-write" referrerpolicy="same-origin"></iframe>
  <noscript><div class="fallback"><p>JavaScript is required. <a href="/RPSGTv2.2026-core.html">Open the RPSGT Study Trail</a>.</p></div></noscript>
  <script>
  (function(){
    var frame=document.getElementById('rpsgtApp');
    frame.src='/RPSGTv2.2026-core.html'+location.search+location.hash;

    function removeMentorButton(){
      try{
        var doc=frame.contentDocument;
        if(!doc) return;
        doc.querySelectorAll('a,button,[role="button"],span,div').forEach(function(el){
          var label=(el.textContent||'').replace(/\s+/g,' ').trim();
          if(/^schedule free mentor(?:ship)? appointment$/i.test(label)){
            el.remove();
          }
        });
      }catch(e){}
    }

    frame.addEventListener('load',function(){
      removeMentorButton();
      try{
        var doc=frame.contentDocument;
        if(doc){
          new MutationObserver(removeMentorButton).observe(doc.documentElement,{childList:true,subtree:true});
          if(doc.title) document.title=doc.title;
        }
      }catch(e){}
      setTimeout(removeMentorButton,250);
      setTimeout(removeMentorButton,1000);
    });

    setInterval(removeMentorButton,1500);
  })();
  </script>
</body>
</html>
