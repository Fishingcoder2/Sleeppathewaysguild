<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RPSGT Study Trail | Sleep Pathways Guild</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f7fb}
    #rpsgtApp{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
    .loadPanel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033;text-align:center;transition:opacity .2s ease}
    .loadPanel.hidden{opacity:0;pointer-events:none}
    .loadCard{width:min(92vw,520px);padding:26px;border:1px solid #d6e0ee;border-radius:20px;background:#fff;box-shadow:0 12px 32px rgba(31,76,132,.12)}
    .loadCard h1{margin:0 0 10px;font-size:1.4rem;color:#12325f}.loadCard p{margin:7px 0;line-height:1.55;color:#526173}
    .spinner{width:36px;height:36px;margin:0 auto 16px;border:4px solid #dce8f7;border-top-color:#1f5fbf;border-radius:50%;animation:spin .8s linear infinite}
    .fallbackLink{display:none;margin-top:15px;color:#1f5fbf;font-weight:800}.showFallback .fallbackLink{display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loadPanel" id="loadPanel" role="status" aria-live="polite">
    <div class="loadCard" id="loadCard">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Loading the RPSGT Study Trail</h1>
      <p>The study app is large and may need a few seconds on a phone or slower connection.</p>
      <a class="fallbackLink" href="RPSGTv2.2026-core.html?loader=20260725b">Open the study app directly</a>
    </div>
  </div>

  <iframe id="rpsgtApp" title="Sleep Pathways Guild RPSGT Study Trail" allow="fullscreen; clipboard-write" referrerpolicy="same-origin"></iframe>
  <noscript><div class="loadPanel"><div class="loadCard"><h1>JavaScript is required</h1><p><a href="RPSGTv2.2026-core.html?loader=20260725b">Open the RPSGT Study Trail</a></p></div></div></noscript>

  <script>
  (function(){
    var frame=document.getElementById('rpsgtApp');
    var panel=document.getElementById('loadPanel');
    var card=document.getElementById('loadCard');
    var trademarkPattern=/™|&trade;|&#8482;|&#x2122;/gi;
    var loaded=false;
    var separator=location.search?'&':'?';

    frame.src='RPSGTv2.2026-core.html'+location.search+separator+'loader=20260725b'+location.hash;

    function removeObsoleteControls(doc){
      try{
        doc.querySelectorAll('a,button,[role="button"]').forEach(function(el){
          var label=(el.textContent||'').replace(/\s+/g,' ').trim();
          if(/^schedule free mentor(?:ship)? appointment$/i.test(label))el.remove();
        });
      }catch(e){}
    }

    function cleanTrademarkTextInIdle(doc){
      try{
        if(doc.title)doc.title=doc.title.replace(trademarkPattern,'');
        var walker=doc.createTreeWalker(doc.body||doc.documentElement,NodeFilter.SHOW_TEXT);
        function step(deadline){
          var count=0,node;
          while((node=walker.nextNode())){
            var parent=node.parentElement;
            if(!parent||!/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/i.test(parent.tagName)){
              var value=node.nodeValue||'';
              if(value.indexOf('™')!==-1)node.nodeValue=value.replace(/™/g,'');
            }
            count++;
            if(count>=500 && deadline && deadline.timeRemaining && deadline.timeRemaining()<3){
              schedule();
              return;
            }
          }
        }
        function schedule(){
          if('requestIdleCallback' in window)window.requestIdleCallback(step,{timeout:1200});
          else setTimeout(function(){step(null)},50);
        }
        schedule();
      }catch(e){}
    }

    function finishLoading(){
      if(loaded)return;
      loaded=true;
      panel.classList.add('hidden');
      setTimeout(function(){panel.hidden=true},250);
    }

    frame.addEventListener('load',function(){
      try{
        var doc=frame.contentDocument;
        var hasApp=doc&&doc.body&&doc.body.children.length>0;
        if(!hasApp)throw new Error('Empty app document');
        removeObsoleteControls(doc);
        cleanTrademarkTextInIdle(doc);
        if(doc.title)document.title=doc.title.replace(trademarkPattern,'');
        requestAnimationFrame(function(){requestAnimationFrame(finishLoading)});
        setTimeout(function(){removeObsoleteControls(doc)},1200);
        setTimeout(function(){removeObsoleteControls(doc)},3500);
      }catch(e){
        card.classList.add('showFallback');
        card.querySelector('p').textContent='The study app did not finish loading. Open it directly or refresh the page.';
      }
    });

    setTimeout(function(){
      if(!loaded){
        card.classList.add('showFallback');
        card.querySelector('p').textContent='Loading is taking longer than expected. You can open the study app directly.';
      }
    },15000);
  })();
  </script>
</body>
</html>
