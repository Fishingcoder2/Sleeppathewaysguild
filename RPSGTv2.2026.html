<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="author" content="Tracy Frazier, RHIT, RPSGT, CCS-P">
  <link rel="canonical" href="https://sleeppathwaysguild.com/RPSGTv2.2026.html">
  <title>Free RPSGT Exam Prep Webapp | Sleep Pathways Guild</title>
  <meta name="description" content="Free RPSGT exam preparation webapp with guided study paths, original practice questions, readiness checks, skill labs, and progress reports for sleep technologists.">
  <style>
    :root{color-scheme:light;--blue:#1759a8;--teal:#178d8b;--ink:#172033;--muted:#5f6d7c;--line:#d6e0ee;--bg:#f4f7fb}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
    .card{width:min(92vw,560px);padding:28px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 16px 42px rgba(31,76,132,.14);text-align:center}
    .mark{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-size:26px;font-weight:900}
    h1{margin:0 0 10px;font-size:1.42rem;color:#12325f}p{margin:8px 0;line-height:1.55;color:var(--muted)}
    .bar{height:10px;margin:20px 0 10px;border-radius:999px;background:#e7eef8;overflow:hidden}.fill{height:100%;width:12%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--teal));animation:load 1.3s ease-in-out infinite alternate}
    .status{min-height:1.5em;font-size:.92rem;font-weight:700;color:#40536b}.error{display:none;margin-top:18px;padding:14px;border:1px solid #efc3c3;border-radius:14px;background:#fff5f5;color:#792626;text-align:left;line-height:1.5}.error.show{display:block}
    button,a.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin:12px 5px 0;padding:0 16px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}
    a.secondary{background:#eef3fa;color:#244569;border:1px solid var(--line)}
    @keyframes load{from{width:12%}to{width:88%}}
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">SP</div>
    <h1>Loading the RPSGT Study Trail</h1>
    <p>Opening your study dashboard and mobile practice tools.</p>
    <div class="bar" aria-hidden="true"><div class="fill"></div></div>
    <div class="status" id="status">Preparing the study app…</div>
    <div class="error" id="error"></div>
  </main>
<script>
(() => {
  'use strict';
  const APP_CORE = './RPSGTv2.2026-app.html?v=20260806a';
  const MOBILE_PATCH = './assets/rpsgt-mobile-practice-fix.js?v=20260806a';
  const statusNode = document.getElementById('status');
  const errorNode = document.getElementById('error');

  async function openApp() {
    statusNode.textContent = 'Loading the complete RPSGT study app…';
    const response = await fetch(APP_CORE, {cache:'no-cache'});
    if (!response.ok) throw new Error(`The study app could not be retrieved (${response.status}).`);
    let html = await response.text();
    if (!/<!doctype html/i.test(html) || !html.includes('id="app-data"') || !html.includes('</html>')) {
      throw new Error('The study app did not pass its structural check.');
    }
    statusNode.textContent = 'Applying the mobile practice repair…';
    const patchTag = '<scr' + 'ipt src="' + MOBILE_PATCH + '"></scr' + 'ipt>';
    html = html.replace(/<\/body\s*>/i, patchTag + '</body>');
    document.open('text/html', 'replace');
    document.write(html);
    document.close();
  }

  openApp().catch(error => {
    console.error('RPSGT app launcher failed:', error);
    statusNode.textContent = 'The study app could not be opened.';
    errorNode.classList.add('show');
    errorNode.innerHTML = `<strong>Loading stopped safely.</strong><br>${String(error?.message || error)}<br>` +
      '<button type="button" id="retryButton">Try again</button>' +
      '<a class="button secondary" href="./RPSGTv2.2026-app.html">Open the basic app</a>';
    document.getElementById('retryButton').addEventListener('click', () => location.reload());
  });
})();
</script>
</body>
</html>
