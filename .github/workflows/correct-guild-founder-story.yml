name: Correct Guild founder story

on:
  push:
    paths:
      - '.github/workflows/correct-guild-founder-story.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct founder, mentor, and memorial history
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_lead = '''<p class="lead"><strong style="color:#fff">Sleep Pathways Guild</strong> is an independent, peer-led educational project for sleep technologists, RPSGT learners, CPSGT learners, students, and professionals who want practical review, stronger technical reasoning, and standards-aware learning.</p>'''
          new_lead = '''<p class="lead"><strong style="color:#fff">Sleep Pathways Guild</strong> is an independent, peer-led educational project founded by <strong style="color:#fff">Tracy Frazier, RHIT, RPSGT, CCS-P</strong> for sleep technologists, RPSGT learners, CPSGT learners, students, and professionals who want practical review, stronger technical reasoning, and standards-aware learning.</p>'''
          if old_lead not in text:
              raise SystemExit('Homepage lead text was not found.')
          text = text.replace(old_lead, new_lead, 1)

          old_story = '''        <div class="cards2">
          <article class="card storyCard"><h3>Robert Dopson, RPSGT</h3><p>Sleep Pathways Guild was built by Robert Dopson, RPSGT, from the perspective of a sleep technologist who believes learners deserve practical explanations, useful tools, professional encouragement, and a place to begin without cost being the first obstacle.</p><p>The project is meant to grow as a guild: experienced professionals sharing the craft, learners building confidence, and educational tools improving through careful review and community feedback.</p></article>
          <article class="card storyCard"><h3>Inspired by Dr. William C. Dement</h3><p>The Guild honors the educational example of William C. Dement, MD, PhD. Stanford Medicine describes Dr. Dement as a founder of the field of sleep medicine, a major teacher, and a public advocate who worked to improve awareness of sleep disorders, sleep deprivation, and drowsiness-related danger.</p><p>His commitment to teaching the public that sleep matters remains an important inspiration for keeping understandable sleep education available beyond professional walls.</p><p class="fine"><a href="https://med.stanford.edu/news/all-news/2020/06/william-dement-giant-in-field-of-sleep-medicine-dies-at-91.html" target="_blank" rel="noopener">Read Stanford Medicine’s remembrance of Dr. Dement</a></p></article>
        </div>'''
          new_story = '''        <div class="cards3">
          <article class="card storyCard"><h3>Founded by Tracy Frazier, RHIT, RPSGT, CCS-P</h3><p>Sleep Pathways Guild was founded and built by Tracy Frazier from her experience as a sleep technologist, health information professional, credentialed coding specialist, learner, and educator.</p><p>She created the Guild so serious learners could find practical explanations, free public tools, professional encouragement, and a place to begin without cost being the first obstacle.</p></article>
          <article class="card storyCard"><h3>Inspired by mentor Robert Dopson, RPSGT</h3><p>Tracy’s mentor, Robert Dopson, RPSGT, never turned away an intern or serious learner. He taught in a deeply Socratic way—guiding people to think before simply giving them an answer.</p><p>His teaching approach was to ask <strong style="color:#fff">who, what, when, where, why, and to what extent</strong> before answering the question. That habit of careful inquiry remains part of the Guild’s educational foundation.</p></article>
          <article class="card storyCard"><h3>Honoring William C. Dement, MD, PhD</h3><p>The Guild honors the memory of Dr. William C. Dement, a founder of the field of sleep medicine, legendary teacher, and public advocate for sleep health and safety.</p><p class="notice"><strong>“Drowsiness is red alert.”</strong> — William C. Dement, MD, PhD</p><p>His commitment to teaching the public that sleep matters inspires the Guild’s work to keep understandable sleep education available beyond professional walls.</p><p class="fine"><a href="https://med.stanford.edu/news/all-news/2020/06/william-dement-giant-in-field-of-sleep-medicine-dies-at-91.html" target="_blank" rel="noopener">Read Stanford Medicine’s remembrance of Dr. Dement</a></p></article>
        </div>'''
          if old_story not in text:
              raise SystemExit('Existing story block was not found.')
          text = text.replace(old_story, new_story, 1)

          old_footer = '''<a href="#our-story">Our Story<span>Robert Dopson, RPSGT, Dr. William C. Dement, and the Guild mission.</span></a>'''
          new_footer = '''<a href="#our-story">Our Story<span>Founder Tracy Frazier, mentor Robert Dopson, Dr. William C. Dement, and the Guild mission.</span></a>'''
          if old_footer not in text:
              raise SystemExit('Footer story link was not found.')
          text = text.replace(old_footer, new_footer, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct Guild founder mentor and memorial story"
          git push
