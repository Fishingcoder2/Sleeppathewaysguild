name: Remove early affiliate message

on:
  push:
    branches:
      - remove-early-affiliate-message-2026-07-29

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: remove-early-affiliate-message-2026-07-29

      - name: Remove sales-focused hero wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<p class="fine">Books and affiliate links support the project, but they are not the project’s primary purpose.</p>'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one matching paragraph, found {count}.")

          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY

      - name: Commit homepage refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove early affiliate marketing message"
          git push
