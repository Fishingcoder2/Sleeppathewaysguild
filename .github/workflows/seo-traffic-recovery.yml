name: Apply SEO traffic recovery patch

on:
  push:
    branches:
      - fix/seo-traffic-recovery-20260917
    paths:
      - '.github/workflows/seo-traffic-recovery.yml'

permissions:
  contents: write

jobs:
  recover-search-intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/seo-traffic-recovery-20260917

      - name: Restore focused bookstore search intent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('rpsgt-exam-prep-books.html')
          text = page.read_text(encoding='utf-8')

          replacements = {
              'Sleep Technologist Store: BRPT Books, Gear & Gifts | SPG': 'RPSGT Exam Prep Books & Sleep Technology Textbooks | SPG',
              'Sleep Technologist Store: BRPT Books, Gear & Gifts': 'RPSGT Exam Prep Books & Sleep Technology Textbooks',
              'Shop BRPT Recommended Readings, Approved ATC References, sleep technologist bags, shirts, gifts, night-shift essentials, and Spanish sleep resources.': 'Browse RPSGT exam prep books, BRPT Recommended Readings, polysomnography textbooks, pediatric sleep references, and free Sleep Pathways Guild study tools.',
              'Books, work gear, night-shift essentials, gifts, and Spanish sleep resources curated for sleep technologists.': 'RPSGT exam prep books, BRPT reading resources, polysomnography texts, and optional sleep-tech gear curated for sleep technologists.',
              'Curated BRPT study books, sleep-tech work gear, night-shift essentials, gifts, and Spanish resources.': 'Curated RPSGT exam prep books, BRPT reading resources, polysomnography texts, and optional sleep-tech gear.',
              '<h1>Books, gear & resources for sleep technologists.</h1>': '<h1>RPSGT exam prep books & resources for sleep technologists.</h1>',
              '"name":"Sleep Technologist Store"': '"name":"RPSGT Exam Prep Books"'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected bookstore text not found: {old}')
              text = text.replace(old, new)

          page.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          old = '<url><loc>https://sleeppathwaysguild.com/rpsgt-exam-prep-books</loc><lastmod>2026-09-04</lastmod><priority>0.85</priority></url>'
          new = '<url><loc>https://sleeppathwaysguild.com/rpsgt-exam-prep-books</loc><lastmod>2026-09-17</lastmod><priority>0.85</priority></url>'
          if old not in sm:
              raise SystemExit('Expected bookstore sitemap entry not found')
          sitemap.write_text(sm.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run repository SEO and link audits
        run: |
          python scripts/seo_audit.py --site-url https://sleeppathwaysguild.com
          python scripts/link_audit.py --site-url https://sleeppathwaysguild.com

      - name: Remove one-time workflow and commit recovery patch
        shell: bash
        run: |
          rm -f .github/workflows/seo-traffic-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore RPSGT bookstore search intent'
          git push origin HEAD:fix/seo-traffic-recovery-20260917
