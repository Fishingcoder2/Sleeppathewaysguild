name: Temporary RPSGT v3 staging visual validation

on:
  push:
    branches:
      - work/rpsgt-v3-staging-visual-realism-20260815
    paths:
      - 'rpsgt-v3/core/visual-psg-renderer.js'
      - 'rpsgt-v3/scripts/test-visual-lab.mjs'
      - '.github/workflows/tmp-rpsgt-v3-staging-visual-ci.yml'

permissions:
  contents: read

jobs:
  staging-visual-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch head
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check staging renderer
        run: node --check rpsgt-v3/core/visual-psg-renderer.js
      - name: Run visual lab regression
        run: node rpsgt-v3/scripts/test-visual-lab.mjs
