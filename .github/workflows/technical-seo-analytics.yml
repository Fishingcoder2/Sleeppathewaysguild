name: Apply technical SEO and analytics coverage

on:
  push:
    branches:
      - technical-seo-analytics-2026-07-27
    paths:
      - tools/technical_seo.py
      - .github/workflows/technical-seo-analytics.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: technical-seo-analytics-2026-07-27
          fetch-depth: 0

      - name: Apply metadata, schema, and analytics coverage
        run: python3 tools/technical_seo.py

      - name: Validate public pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/technical_seo.py
          for page in index.html RPSGTv2.2026.html ekg.2026.html flashcards.2026.html; do
            test -s "$page"
            grep -q 'G-MZTRYT67VG' "$page"
            grep -q 'rel="canonical"' "$page"
            grep -q 'application/ld+json' "$page"
          done
          test -s robots.txt
          test -s sitemap.xml
          test -s 404.html
          grep -q '<urlset' sitemap.xml

      - name: Commit optimized site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sleep Pathways Guild Automation'
          git config user.email 'admin@sleeppathsguild.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No site changes were needed.'
          else
            git commit -m 'Add technical SEO and complete analytics coverage'
            git push origin HEAD:technical-seo-analytics-2026-07-27
          fi
