name: Update Ezoic ads.txt

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    paths:
      - ".github/workflows/update-ezoic-ads-txt.yml"

permissions:
  contents: write

concurrency:
  group: update-ezoic-ads-txt
  cancel-in-progress: true

jobs:
  update-ads-txt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Download Ezoic managed ads.txt
        run: |
          set -euo pipefail
          curl -fsSL "https://srv.adstxtmanager.com/19390/sleeppathwaysguild.com" -o ads.txt
          test -s ads.txt
          if grep -qiE "<html|not found|error" ads.txt; then
            echo "Downloaded ads.txt does not look valid."
            cat ads.txt
            exit 1
          fi

      - name: Commit ads.txt if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- ads.txt)" ]; then
            git add ads.txt
            git commit -m "Update Ezoic ads.txt"
            git pull --rebase origin main
            git push
          else
            echo "ads.txt is already up to date."
          fi
