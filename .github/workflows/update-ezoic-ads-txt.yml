name: Maintain Ezoic ads.txt redirect

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    paths:
      - ".github/workflows/update-ezoic-ads-txt.yml"

permissions:
  contents: write

concurrency:
  group: maintain-ezoic-ads-txt
  cancel-in-progress: true

jobs:
  maintain-ads-txt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Write Ezoic Ads.txt Manager redirect
        run: |
          set -euo pipefail
          printf 'redirect=https://srv.adstxtmanager.com/19390/sleeppathwaysguild.com\n' > ads.txt

      - name: Commit ads.txt if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- ads.txt)" ]; then
            git add ads.txt
            git commit -m "Maintain Ezoic ads.txt redirect"
            git pull --rebase origin main
            git push
          else
            echo "ads.txt redirect is already up to date."
          fi
