name: One-time live repository cleanup

on:
  push:
    branches:
      - cleanup-live-repo-2026-07-29

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup-live-repo-2026-07-29
          fetch-depth: 0

      - name: Remove obsolete CPSGT packages and repair report count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          app = Path('cpsgt-study-app.html')
          text = app.read_text(encoding='utf-8')

          if '<!DOCTYPE html>' not in text[:200].upper() or 'CPSGT' not in text:
              raise SystemExit('cpsgt-study-app.html did not pass the standalone-app check')
          if '.cpsgt-upload' in text or 'cpsgt-assets/' in text:
              raise SystemExit('The live app still references obsolete loader packages')

          pattern = re.compile(
              r'function domainReportData\(\)\{\s*'
              r'return \["1","2","3","4"\]\.map\(d=>\(\{\s*'
              r'key:d,\s*'
              r'label:DOMAIN_NAMES\[d\],\s*'
              r'pct:masteryPct\(d\),\s*'
              r'tasks:reportTaskPerformance\(\)\.filter\(row=>row\.domain===d\)\s*'
              r'\}\)\);\s*'
              r'\}'
          )
          replacement = '''function domainReportData(){
            return ["1","2","3","4"].map(d=>({
              key:d,
              label:DOMAIN_NAMES[d],
              pct:masteryPct(d),
              missed:activeMissedQuestionRows().filter(({q})=>String(q?.d)===d||q?.blueprintCrossReference?.domainCode===`D${d}`).length,
              tasks:reportTaskPerformance().filter(row=>row.domain===d)
            }));
          }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one domainReportData block; replaced {count}')
          if 'Missed: ${d.missed}' not in text:
              raise SystemExit('Expected report output using d.missed was not found')
          app.write_text(text, encoding='utf-8')

          for obsolete in (Path('.cpsgt-upload'), Path('cpsgt-assets')):
              if obsolete.exists():
                  shutil.rmtree(obsolete)

          workflow = Path('.github/workflows/cleanup-live-repo.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify cleanup scope
        shell: bash
        run: |
          test ! -e .cpsgt-upload
          test ! -e cpsgt-assets
          test ! -e .github/workflows/cleanup-live-repo.yml
          ! grep -R --line-number --fixed-strings 'admin@sleeppathsguild.com' --include='*.html' --include='*.xml' --include='*.json' --include='*.txt' .
          git diff --check
          git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean obsolete CPSGT assets and fix report counts"
          git push origin cleanup-live-repo-2026-07-29
