name: Temporary RPSGT v3 staging visual browser QA

on:
  push:
    branches:
      - work/rpsgt-v3-staging-visual-realism-20260815
    paths:
      - 'rpsgt-v3/core/visual-psg-renderer.js'
      - 'rpsgt-v3/scripts/test-visual-lab.mjs'
      - '.github/workflows/tmp-rpsgt-v3-staging-visual-browser-qa.yml'

permissions:
  contents: read

jobs:
  visual-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rpsgt-v3
    steps:
      - name: Check out exact feature branch head
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run renderer and visual lab regressions
        run: |
          node --check core/visual-psg-renderer.js
          node scripts/test-visual-lab.mjs

      - name: Run visual lab browser smoke checks
        continue-on-error: true
        run: npx playwright test --config=playwright.config.mjs --project=desktop-chromium --grep 'lab-visual.html loads without runtime errors or body overflow'

      - name: Capture all five staging epochs for visual review
        run: |
          mkdir -p qa-visuals
          python3 -m http.server 4173 --directory . >/tmp/rpsgt-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { mkdir } from 'node:fs/promises';
          await mkdir('qa-visuals', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/lab-visual.html', { waitUntil: 'networkidle' });
          await page.waitForFunction(() => Boolean(window.RPSGTVisualPSGRenderer));
          const studies = await page.evaluate(async () => {
            const response = await fetch('data/visual/prototype-sleep-staging.json', { cache: 'no-store' });
            const data = await response.json();
            return data.studies;
          });
          for (const study of studies) {
            await page.evaluate((currentStudy) => {
              document.body.innerHTML = '';
              document.body.style.margin = '0';
              document.body.style.padding = '18px';
              document.body.style.background = '#eef5f8';
              const card = document.createElement('section');
              card.id = 'qa-card';
              card.style.width = '1200px';
              card.style.background = '#fff';
              card.style.padding = '14px';
              card.style.boxSizing = 'border-box';
              card.style.fontFamily = 'system-ui, sans-serif';
              const title = document.createElement('h1');
              title.textContent = `${currentStudy.stage} — ${currentStudy.title}`;
              title.style.fontSize = '20px';
              title.style.margin = '0 0 10px';
              card.appendChild(title);
              const canvas = document.createElement('canvas');
              card.appendChild(canvas);
              document.body.appendChild(card);
              window.RPSGTVisualPSGRenderer.render(canvas, currentStudy, { width: 1160 });
            }, study);
            await page.locator('#qa-card').screenshot({ path: `qa-visuals/${study.stage}.png` });
          }
          await browser.close();
          NODE

      - name: Upload staging visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rpsgt-v3-staging-visual-qa
          path: rpsgt-v3/qa-visuals/*.png
          if-no-files-found: error
          retention-days: 7
