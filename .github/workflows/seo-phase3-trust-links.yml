name: Apply SEO phase 3 trust links

on:
  push:
    branches:
      - seo-phase-3-trust-pages-2026-07-29

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-phase-3-trust-pages-2026-07-29
          fetch-depth: 0
      - name: Add trust pages to homepage footer
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          text = page.read_text(encoding='utf-8')
          old = '<a href="https://blog.sleeppathwaysguild.com/">Guild Blog<span>Articles, study support, and field updates.</span></a></div></div></footer>'
          new = '<a href="https://blog.sleeppathwaysguild.com/">Guild Blog<span>Articles, study support, and field updates.</span></a><a href="/about/">About the Guild<span>Purpose, founder, educational approach, and independent status.</span></a><a href="/editorial-standards/">Editorial Standards<span>Source hierarchy, review practices, corrections, and exam integrity.</span></a><a href="/affiliate-disclosure/">Affiliate Disclosure<span>Amazon Associates disclosure and editorial-independence policy.</span></a><a href="/contact/">Contact & Corrections<span>Questions, broken links, accessibility feedback, and correction reports.</span></a></div></div></footer>'
          if old not in text:
              raise SystemExit('Expected homepage footer segment not found')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit homepage trust links
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link trust pages from homepage footer"
          git push origin HEAD:seo-phase-3-trust-pages-2026-07-29
