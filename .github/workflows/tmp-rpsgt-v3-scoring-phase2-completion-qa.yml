name: Temporary RPSGT v3 Scoring Phase 2 completion QA

on:
  push:
    branches:
      - agent/rpsgt-v3-scoring-phase2-completion-20260816
    paths:
      - 'rpsgt-v3/**'
      - '.github/workflows/tmp-rpsgt-v3-scoring-phase2-completion-qa.yml'

permissions:
  contents: read

jobs:
  scoring-context-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rpsgt-v3
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Scoring Phase 2 regressions
        run: |
          node --check core/scoring-context-engine.js
          node --check core/scoring-context-renderer.js
          node --check core/lab-scoring-context.js
          node scripts/test-scoring-lab-system.mjs
          node scripts/test-scoring-context-system.mjs
          node scripts/test-scoring-lab-shell.mjs
          node scripts/test-lab-catalog.mjs
          node scripts/test-labs-shell.mjs
      - name: Exercise context skill and persistence in Chromium
        run: |
          python3 -m http.server 4173 --directory . >/tmp/rpsgt-v3-scoring-context-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { mkdir } from 'node:fs/promises';
          await mkdir('qa-scoring-context', { recursive: true });
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1});
          const consoleErrors=[];page.on('console',msg=>{if(msg.type()==='error'&&!/NotSameOrigin|favicon/i.test(msg.text()))consoleErrors.push(msg.text());});
          await page.goto('http://127.0.0.1:4173/lab-scoring.html',{waitUntil:'networkidle'});
          const pack=await page.evaluate(()=>fetch('data/scoring/context-cases.json').then(r=>r.json()));
          const launchers=page.locator('[data-scoring-context-start]');if(await launchers.count()!==2)throw new Error('Expected two context-skill launch buttons.');
          await launchers.nth(1).click();await page.locator('[data-scoring-context-canvas]').waitFor();
          const workspace=page.locator('[data-scoring-context-workspace]');
          const captured=new Set();
          for(let index=0;index<8;index+=1){
            const prompt=(await workspace.locator('.report-intro').first().innerText()).trim();
            const item=pack.cases.find(entry=>entry.prompt===prompt);if(!item)throw new Error('Could not match rendered context case to case pack.');
            const cue=await workspace.locator('[data-scoring-context-scroll-cue]').innerText();if(!/Swipe left\/right to inspect the full/i.test(cue))throw new Error('Full-trace swipe guidance is missing.');
            const trace=workspace.locator('.scoring-context-trace');const dimensions=await trace.evaluate(node=>({scrollWidth:node.scrollWidth,clientWidth:node.clientWidth}));if(dimensions.scrollWidth<=dimensions.clientWidth)throw new Error('Context trace no longer preserves horizontal detail on mobile.');
            if(!captured.has(item.family)){await workspace.locator('[data-scoring-context-canvas]').screenshot({path:`qa-scoring-context/${item.family}-full-trace.png`});captured.add(item.family);}
            await workspace.getByRole('button',{name:item.answer,exact:true}).click();
            await page.getByText(/intended teaching decision/i).waitFor();
            if(index===0){const wrong=item.evidence.find(entry=>!entry.correct);await workspace.getByRole('button',{name:wrong.label,exact:true}).click();const proof=(await workspace.locator('[data-scoring-context-evidence]').innerText()).toLowerCase();if(!proof.includes('0/2 clues confirmed'))throw new Error('Wrong evidence choice advanced the context case.');}
            for(const choice of item.evidence.filter(entry=>entry.correct)){await workspace.getByRole('button',{name:choice.label,exact:true}).click();}
            await page.getByText(/Evidence confirmed/i).waitFor();await workspace.locator('[data-scoring-context-next]').click();
          }
          await page.getByText(/Scoring-context skill passed/i).waitFor();
          const summary=(await page.locator('[data-scoring-summary]').innerText()).toLowerCase();if(!summary.includes('scoring context')||!summary.includes('100%'))throw new Error('Context skill result is missing from Scoring summary.');
          let saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('spg_rpsgt_v3')));if(saved?.labs?.scoring?.contextSkillPassed!==true)throw new Error('Context skill did not persist.');
          const station=page.locator('[data-scoring-station]').first();await station.check();
          saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('spg_rpsgt_v3')));if(saved?.labs?.scoring?.contextSkillPassed!==true||!Array.isArray(saved?.labs?.scoring?.contextSkillHistory)||saved.labs.scoring.contextSkillHistory.length<1)throw new Error('Existing station controller overwrote context skill state.');
          if(consoleErrors.length)throw new Error('Unexpected console errors: '+consoleErrors.join(' | '));
          const bodyOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(bodyOverflow>2)throw new Error('Mobile Scoring page has body-level horizontal overflow: '+bodyOverflow);
          await page.locator('main').screenshot({path:'qa-scoring-context/scoring-phase2-complete-mobile.png',fullPage:true});
          await browser.close();
          NODE
      - name: Upload Scoring Phase 2 QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rpsgt-v3-scoring-phase2-completion-qa
          path: rpsgt-v3/qa-scoring-context/*.png
          if-no-files-found: error
          retention-days: 7
