name: Complete Sleep Technologist Store

on:
  push:
    branches: [main]
    paths:
      - 'scripts/complete_sleep_store_20260910.py'
      - '.github/workflows/complete-sleep-store-20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply curated storefront patch
        run: python scripts/complete_sleep_store_20260910.py
      - name: Validate curated storefront
        run: |
          grep -q 'id="guild-picks"' rpsgt-exam-prep-books.html
          grep -q 'BAGSMART Paz 23L Backpack' rpsgt-exam-prep-books.html
          grep -q 'Peak Design Tech Pouch' rpsgt-exam-prep-books.html
          grep -q 'YETI Rambler 30 oz Tumbler' rpsgt-exam-prep-books.html
          grep -q 'Stanley Quencher H2.0 FlowState 30 oz Tumbler' rpsgt-exam-prep-books.html
          grep -q 'Carhartt Insulated 12 Can Two Compartment Lunch Cooler' rpsgt-exam-prep-books.html
          test "$(grep -o 'tag=spg_rpsgt-20' rpsgt-exam-prep-books.html | wc -l)" -ge 6
          git diff --check
      - name: Run SEO audit
        run: python scripts/seo_audit.py --site-url https://sleeppathwaysguild.com
      - name: Run link audit
        run: python scripts/link_audit.py --site-url https://sleeppathwaysguild.com
      - name: Remove one-time patch machinery
        run: |
          rm -f scripts/complete_sleep_store_20260910.py
          rm -f .github/workflows/complete-sleep-store-20260910.yml
      - name: Commit completed storefront
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: complete curated sleep technologist storefront'
            git push origin main
          fi
