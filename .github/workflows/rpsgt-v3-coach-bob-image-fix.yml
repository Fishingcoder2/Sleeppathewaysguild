name: Replace RPSGT V3 Coach Bob image

on:
  push:
    branches:
      - build/rpsgt-v3-modular
    paths:
      - .github/workflows/rpsgt-v3-coach-bob-image-fix.yml

permissions:
  contents: write

jobs:
  replace-coach-bob-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RPSGT V3 branch
        uses: actions/checkout@v4
        with:
          ref: build/rpsgt-v3-modular
          fetch-depth: 0

      - name: Install WebP encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Build clean Coach Bob WebP from Guild cartoon
        run: |
          cwebp -quiet -q 92 -resize 640 0 assets/coach-bob/coach-bob-cartoon.png -o rpsgt-v3/assets/coach-bob-rpsgt.webp
          file rpsgt-v3/assets/coach-bob-rpsgt.webp
          test -s rpsgt-v3/assets/coach-bob-rpsgt.webp

      - name: Commit replacement and remove one-time workflow
        run: |
          rm .github/workflows/rpsgt-v3-coach-bob-image-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpsgt-v3/assets/coach-bob-rpsgt.webp .github/workflows/rpsgt-v3-coach-bob-image-fix.yml
          git commit -m "fix(rpsgt-v3): replace Coach Bob portrait"
          git push origin HEAD:build/rpsgt-v3-modular
