name: RPSGT v3 Guided Study isolation diagnostic

on:
  push:
    branches:
      - release/rpsgt-v3-browser-parallel-2026-08-11
    paths:
      - '.github/workflows/rpsgt-v3-study-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rpsgt-v3
    steps:
      - name: Checkout frozen release candidate
        uses: actions/checkout@v4
        with:
          ref: c42bea72d8b5c85618a3780c33b4528ea52990a5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install diagnostic dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Guided Study script isolation
        shell: bash
        run: |
          python3 -m http.server 4173 --directory .. >/tmp/rpsgt-study-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat >/tmp/study-isolation.mjs <<'NODE'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:4173/rpsgt-v3/study.html';
          const trials=[
            ['baseline',[]],
            ['no-learner-ui',['guided-study-learner-ui.js']],
            ['no-question-actions',['guided-study-question-actions.js']],
            ['no-completion',['guided-study-completion.js']],
            ['no-study-presentation',['study-presentation.js']],
            ['no-respiratory-trail',['respiratory-study-trail.js']],
            ['no-resource-catalog',['study-resource-catalog.js','guided-study-question-actions.js']],
            ['minimal-study',['guided-study-learner-ui.js','guided-study-question-actions.js','guided-study-completion.js','respiratory-study-trail.js','guided-study-coach.js','study-presentation.js']]
          ];
          const browser=await chromium.launch({headless:true});
          for(const [name,blocked] of trials){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            for(const file of blocked){
              await page.route(`**/core/${file}`,route=>route.abort());
            }
            const started=Date.now();
            let outcome='loaded'; let error='';
            try{
              await page.goto(base,{waitUntil:'load',timeout:8000});
            }catch(err){ outcome='timeout-or-error'; error=String(err.message||err).split('\n')[0]; }
            let taskCards='unavailable';
            try{ taskCards=await page.locator('.task-map-card').count({timeout:1000}); }catch{}
            console.log(JSON.stringify({name,blocked,outcome,elapsedMs:Date.now()-started,taskCards,error}));
            await context.close().catch(()=>{});
          }
          await browser.close();
          NODE
          node /tmp/study-isolation.mjs
