name: Validate RPSGT v3 Practice Center

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rpsgt-v3/practice.html'
      - 'rpsgt-v3/assets/practice*.css'
      - 'rpsgt-v3/core/practice*.js'
      - 'rpsgt-v3/core/app-shell.js'
      - 'rpsgt-v3/scripts/test-practice*.mjs'
      - 'rpsgt-v3/tests/browser/practice-*.spec.mjs'
      - '.github/workflows/rpsgt-v3-practice-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'rpsgt-v3/practice.html'
      - 'rpsgt-v3/assets/practice*.css'
      - 'rpsgt-v3/core/practice*.js'
      - 'rpsgt-v3/core/app-shell.js'
      - 'rpsgt-v3/scripts/test-practice*.mjs'
      - '.github/workflows/rpsgt-v3-practice-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice-center:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Practice JavaScript syntax
        run: |
          node --check rpsgt-v3/core/practice-difficulty.js
          node --check rpsgt-v3/core/practice-subjects.js
          node --check rpsgt-v3/core/practice.js
          node --check rpsgt-v3/core/practice-prefill.js
          node --check rpsgt-v3/core/app-shell.js
          node --check rpsgt-v3/scripts/test-practice-shell.mjs
          node --check rpsgt-v3/scripts/test-practice-subject-filter.mjs
          node --check rpsgt-v3/scripts/test-practice-difficulty-filter.mjs
      - name: Validate Practice shell and isolation
        run: node rpsgt-v3/scripts/test-practice-shell.mjs
      - name: Validate subject-filter integrity
        run: node rpsgt-v3/scripts/test-practice-subject-filter.mjs
      - name: Validate difficulty groups across all learner-ready question records
        run: node rpsgt-v3/scripts/test-practice-difficulty-filter.mjs

  hard-filter-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rpsgt-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify real Hard filter in desktop and mobile Chromium
        run: npx playwright test --config=playwright.config.mjs --project=desktop-chromium --project=mobile-chromium tests/browser/practice-hard-difficulty.spec.mjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpsgt-v3-practice-hard-filter-browser
          path: |
            rpsgt-v3/test-results
            rpsgt-v3/playwright-report
          if-no-files-found: ignore
