name: Fix RPSGT v2 flashcard routing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-rpsgt-v2-flashcards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch sticky flashcard click routing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("RPSGTv2.2026.html")
          text = path.read_text(encoding="utf-8")

          old = '''data-flashcard-id="'+esc(fc.id)+'"><strong>'''
          new = '''data-spg-open-card62a="'+esc(fc.id)+'"><strong>'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly 1 v12.62 flashcard binding, found {count}")

          text = text.replace(old, new, 1)

          if text.count(new) != 1:
              raise SystemExit("Patched binding verification failed")
          if "if(b.dataset.spgOpenCard62a)" not in text:
              raise SystemExit("Expected v12.62 click handler is missing")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RPSGTv2.2026.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix RPSGT v2 sticky flashcard click routing"
          git push
