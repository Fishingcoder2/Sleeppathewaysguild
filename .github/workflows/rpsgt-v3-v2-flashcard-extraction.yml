name: Extract preserved RPSGT v2 flashcards

on:
  push:
    branches:
      - release/rpsgt-v3-2026-08-11
    paths:
      - '.github/workflows/rpsgt-v3-v2-flashcard-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-v2-flashcards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch preserved v2 source branch
        run: git fetch origin rpsgt-pre-repair-20260725:rpsgt-pre-repair-20260725

      - name: Extract final effective v2 deck
        run: |
          git show rpsgt-pre-repair-20260725:RPSGTv2.2026-core.html > /tmp/RPSGTv2.2026-core.html
          node rpsgt-v3/scripts/extract-v2-flashcards.mjs /tmp/RPSGTv2.2026-core.html rpsgt-v3/data/flashcards-v2-extracted.json

      - name: Validate extracted inventory
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const deck=JSON.parse(fs.readFileSync('rpsgt-v3/data/flashcards-v2-extracted.json','utf8'));
          if(deck.cardCount!==deck.cards.length) throw new Error('v2 card count mismatch');
          if(deck.categoryCount!==deck.categories.length) throw new Error('v2 category count mismatch');
          if(new Set(deck.cards.map(card=>card.id)).size!==deck.cardCount) throw new Error('duplicate v2 ids');
          console.log(`Validated ${deck.cardCount} cards in ${deck.categoryCount} categories.`);
          NODE

      - name: Commit extracted deck to release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpsgt-v3/data/flashcards-v2-extracted.json
          if git diff --cached --quiet; then
            echo 'Extracted deck is already current.'
          else
            git commit -m 'Extract final RPSGT v2 flashcard inventory'
            git push origin HEAD:release/rpsgt-v3-2026-08-11
          fi
