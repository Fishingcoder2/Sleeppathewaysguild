name: Hide RPSGT mentor appointment button

on:
  push:
    paths:
      - '.github/workflows/hide-rpsgt-mentor-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add safe runtime removal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RPSGTv2.2026.html')
          text = path.read_text(encoding='utf-8')
          marker = 'spg-remove-mentor-button'
          if marker in text:
              print('Safe mentor-button patch already present.')
              raise SystemExit(0)

          script = r'''
<script id="spg-remove-mentor-button">
(function(){
  function removeMentorAppointmentButton(){
    document.querySelectorAll('a,button,[role="button"]').forEach(function(el){
      var label=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(/^schedule free mentor appointment$/i.test(label) || /^schedule free mentorship appointment$/i.test(label)){
        el.remove();
      }
    });
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',removeMentorAppointmentButton,{once:true});
  }else{
    removeMentorAppointmentButton();
  }
  new MutationObserver(removeMentorAppointmentButton).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
'''

          pos = text.lower().rfind('</body>')
          if pos == -1:
              raise SystemExit('Could not find closing </body>; file left unchanged.')
          text = text[:pos] + script + text[pos:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit safe patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RPSGTv2.2026.html
          git diff --cached --quiet || git commit -m "Safely hide mentor appointment button"
          git push
