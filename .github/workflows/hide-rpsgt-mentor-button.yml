name: Hide RPSGT mentor appointment button

on:
  push:
    paths:
      - '.github/workflows/hide-rpsgt-mentor-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add and validate safe runtime removal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RPSGTv2.2026.html')
          text = path.read_text(encoding='utf-8')
          marker = 'spg-remove-mentor-button'

          script = r'''
<script id="spg-remove-mentor-button">
(function(){
  function removeMentorAppointmentButton(){
    document.querySelectorAll('a,button,[role="button"],span,div').forEach(function(el){
      var label=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(/^schedule free mentor(?:ship)? appointment$/i.test(label)){
        el.style.display='none';
        el.setAttribute('aria-hidden','true');
        el.remove();
      }
    });
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',removeMentorAppointmentButton,{once:true});
  }else{
    removeMentorAppointmentButton();
  }
  window.addEventListener('load',removeMentorAppointmentButton,{once:true});
  new MutationObserver(removeMentorAppointmentButton).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(removeMentorAppointmentButton,250);
  setTimeout(removeMentorAppointmentButton,1000);
})();
</script>
'''

          if marker not in text:
              pos = text.lower().rfind('</body>')
              if pos == -1:
                  raise SystemExit('Could not find closing </body>; file left unchanged.')
              text = text[:pos] + script + text[pos:]

          if text.count(marker) != 1:
              raise SystemExit('Validation failed: expected exactly one safe-patch marker.')
          if '</body>' not in text.lower() or '</html>' not in text.lower():
              raise SystemExit('Validation failed: closing document tags missing.')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit safe patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RPSGTv2.2026.html
          git diff --cached --quiet || git commit -m "Safely hide mentor appointment button"
          git push
