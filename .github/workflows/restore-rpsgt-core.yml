name: Restore RPSGT core webapp

on:
  push:
    paths:
      - '.github/workflows/restore-rpsgt-core.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate working RPSGT source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1rVWb2RRjTblbRlaaDmAn4FeiteI6FKBQ&export=download&confirm=t' \
            --output RPSGTv2.2026-core.html

          test -s RPSGTv2.2026-core.html
          test "$(wc -c < RPSGTv2.2026-core.html)" -gt 10000000
          grep -qi '<!DOCTYPE html' RPSGTv2.2026-core.html
          grep -q 'id="app-data"' RPSGTv2.2026-core.html
          grep -q 'RPSGT Study Trail' RPSGTv2.2026-core.html
          grep -q '</html>' RPSGTv2.2026-core.html

          python3 - <<'PY'
          from pathlib import Path
          p = Path('RPSGTv2.2026-core.html')
          text = p.read_text(encoding='utf-8')
          if len(text) < 10_000_000:
              raise SystemExit('RPSGT source is unexpectedly small.')
          if text.count('<script') < 10 or text.count('</script>') < 10:
              raise SystemExit('RPSGT source appears incomplete.')
          if 'questionCount":2905' not in text:
              raise SystemExit('Expected verified question-bank build was not downloaded.')
          PY

      - name: Commit restored core and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-rpsgt-core.yml
          git config user.name 'Sleep Pathways Guild Automation'
          git config user.email 'admin@sleeppathsguild.com'
          git add -A
          git commit -m 'Restore complete RPSGT core webapp'
          git push origin "HEAD:${GITHUB_REF_NAME}"
