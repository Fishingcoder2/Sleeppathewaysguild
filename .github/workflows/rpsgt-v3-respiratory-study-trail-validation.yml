name: Validate RPSGT v3 Respiratory Study Trail

on:
  pull_request:
    paths:
      - 'rpsgt-v3/data/learner-trails/respiratory-pap.json'
      - 'rpsgt-v3/core/respiratory-study-trail.js'
      - 'rpsgt-v3/assets/respiratory-study-trail.css'
      - 'rpsgt-v3/study.html'
      - 'rpsgt-v3/core/home-dashboard.js'
      - 'rpsgt-v3/core/labs.js'
      - 'rpsgt-v3/data/study-sources/principles-practice-sleep-medicine-7e.json'
      - 'rpsgt-v3/data/study-sources/topic-families-pap-modalities.json'
      - 'rpsgt-v3/scripts/test-respiratory-study-trail.mjs'
      - '.github/workflows/rpsgt-v3-respiratory-study-trail-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'rpsgt-v3/data/learner-trails/respiratory-pap.json'
      - 'rpsgt-v3/core/respiratory-study-trail.js'
      - 'rpsgt-v3/assets/respiratory-study-trail.css'
      - 'rpsgt-v3/study.html'
      - 'rpsgt-v3/core/home-dashboard.js'
      - 'rpsgt-v3/core/labs.js'
      - 'rpsgt-v3/data/study-sources/principles-practice-sleep-medicine-7e.json'
      - 'rpsgt-v3/data/study-sources/topic-families-pap-modalities.json'
      - 'rpsgt-v3/scripts/test-respiratory-study-trail.mjs'
      - '.github/workflows/rpsgt-v3-respiratory-study-trail-validation.yml'

permissions:
  contents: read

jobs:
  respiratory-study-trail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate Respiratory/PAP Study Trail
        run: node rpsgt-v3/scripts/test-respiratory-study-trail.mjs
