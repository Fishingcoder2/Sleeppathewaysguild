name: Validate RPSGT v3 Study Calculator

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rpsgt-v3/practice.html'
      - 'rpsgt-v3/math-coach.html'
      - 'rpsgt-v3/core/practice-calculator.js'
      - 'rpsgt-v3/assets/practice-calculator.css'
      - 'rpsgt-v3/scripts/test-practice-calculator.mjs'
      - 'rpsgt-v3/scripts/test-math-coach-shell.mjs'
      - '.github/workflows/rpsgt-v3-practice-calculator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study-calculator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check calculator JavaScript syntax
        run: |
          node --check rpsgt-v3/core/practice-calculator.js
          node --check rpsgt-v3/scripts/test-practice-calculator.mjs
      - name: Validate shared calculator behavior and learner isolation
        run: node rpsgt-v3/scripts/test-practice-calculator.mjs
