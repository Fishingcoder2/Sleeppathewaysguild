name: Validate RPSGT v3 Readiness results

on:
  pull_request:
    branches: [main]
    paths:
      - 'rpsgt-v3/core/readiness.js'
      - 'rpsgt-v3/readiness.html'
      - 'rpsgt-v3/assets/readiness.css'
      - 'rpsgt-v3/scripts/test-readiness-shell.mjs'
      - 'rpsgt-v3/tests/browser/readiness-result-navigation.spec.mjs'
      - '.github/workflows/rpsgt-v3-readiness-results-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate Readiness engine and controller
        run: |
          node --check rpsgt-v3/core/readiness.js
          node rpsgt-v3/scripts/test-readiness-shell.mjs
          node rpsgt-v3/scripts/test-readiness-system.mjs
      - name: Install Playwright dependencies
        working-directory: rpsgt-v3
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: rpsgt-v3
        run: npx playwright install --with-deps chromium
      - name: Exercise final result button and saved history on desktop and mobile
        working-directory: rpsgt-v3
        run: npx playwright test --config=playwright.config.mjs --project=desktop-chromium --project=mobile-chromium tests/browser/readiness-result-navigation.spec.mjs
      - name: Save failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpsgt-v3-readiness-result-navigation-evidence
          path: |
            rpsgt-v3/test-results
            rpsgt-v3/playwright-report
          if-no-files-found: ignore
