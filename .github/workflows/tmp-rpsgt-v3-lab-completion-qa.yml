name: Temporary RPSGT v3 lab completion QA

on:
  push:
    branches:
      - agent/rpsgt-v3-lab-completion-initiative
    paths:
      - 'rpsgt-v3/**'
      - '.github/workflows/tmp-rpsgt-v3-lab-completion-qa.yml'

permissions:
  contents: read

jobs:
  lab-completion-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rpsgt-v3
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run scoring and catalog regressions
        run: |
          node --check core/scoring-lab-engine.js
          node --check core/lab-scoring.js
          node scripts/test-scoring-lab-system.mjs
          node scripts/test-scoring-lab-shell.mjs
          node scripts/test-lab-catalog.mjs
      - name: Exercise interactive staging skill in Chromium
        run: |
          python3 -m http.server 4173 --directory . >/tmp/rpsgt-v3-lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { mkdir } from 'node:fs/promises';
          await mkdir('qa-lab-completion', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 430, height: 932 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/lab-scoring.html', { waitUntil: 'networkidle' });
          await page.locator('[data-scoring-stage-start]').first().click();
          await page.locator('[data-scoring-stage-canvas]').waitFor();
          const canvas = page.locator('[data-scoring-stage-canvas]');
          const size = await canvas.evaluate(node => ({ width: node.width, height: node.height }));
          if (!(size.width > 900 && size.height > 300)) throw new Error('Staging canvas did not render.');
          for (let epoch = 0; epoch < 5; epoch += 1) {
            const options = page.locator('[data-scoring-stage-answer]');
            if (await options.count() !== 5) throw new Error('Expected five stage choices.');
            await options.first().click();
            await page.locator('[data-scoring-stage-feedback]').getByText('The intended stage is').waitFor();
            await page.locator('[data-scoring-stage-next]').click();
          }
          await page.getByText(/Stage recognition skill/).first().waitFor();
          await page.locator('main').screenshot({ path: 'qa-lab-completion/scoring-stage-skill-mobile.png', fullPage: true });
          const bodyText = await page.locator('body').innerText();
          if (!bodyText.includes('Stage skill')) throw new Error('Stage-skill summary is not visible.');
          await browser.close();
          NODE
      - name: Upload scoring QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: rpsgt-v3-lab-completion-qa
          path: rpsgt-v3/qa-lab-completion/*.png
          if-no-files-found: error
          retention-days: 7
