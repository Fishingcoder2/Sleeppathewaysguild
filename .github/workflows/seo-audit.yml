name: SEO and link audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify public release and contact copy
        run: python scripts/content_integrity.py

      - name: Audit sitemap-listed pages
        run: python scripts/seo_audit.py --site-url https://sleeppathwaysguild.com

      - name: Audit internal and live public links
        run: python scripts/link_audit.py --site-url https://sleeppathwaysguild.com --live

      - name: Upload website audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-audit-reports
          path: |
            seo-audit-report.txt
            link-audit-report.txt
