name: SEO and link audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify public release and contact copy
        run: python scripts/content_integrity.py

      - name: Audit sitemap-listed pages
        run: python scripts/seo_audit.py --site-url https://sleeppathwaysguild.com

      - name: Audit branch links before publication
        if: github.event_name == 'pull_request'
        run: python scripts/link_audit.py --site-url https://sleeppathwaysguild.com

      - name: Audit internal and live public links
        if: github.event_name != 'pull_request'
        run: python scripts/link_audit.py --site-url https://sleeppathwaysguild.com --live

      - name: Set up Node for tutoring intake validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify tutoring consent and form controls
        run: node scripts/tutoring-intake-test.mjs

      - name: Inventory public download buttons
        run: python scripts/download_link_inventory.py

      - name: Upload website audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-audit-reports
          path: |
            seo-audit-report.txt
            link-audit-report.txt
            download-link-inventory.txt
