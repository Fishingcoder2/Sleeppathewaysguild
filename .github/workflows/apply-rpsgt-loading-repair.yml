name: CPSGT branch inspection

on:
  push:
    branches:
      - build/cpsgt-shared-affiliate-links-20260910

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory CPSGT commerce records
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('cpsgt-study-app.html').read_text(encoding='utf-8')

          def extract_json_after(marker, close_marker):
            i=s.find(marker)
            if i<0:
              print('MISSING',marker); return None
            start=i+len(marker)
            end=s.find(close_marker,start)
            if end<0:
              print('MISSING CLOSE',close_marker); return None
            raw=s[start:end+1]
            return json.loads(raw)

          books=extract_json_after('const BOOK_RECOMMENDATIONS=','];')
          print('===== BOOK RECOMMENDATIONS =====')
          for b in books or []:
            print(json.dumps({k:b.get(k) for k in ['id','title','edition','year','isbn13','asin','url','linkType','sourceType','sourceLabel','status']},ensure_ascii=False))

          marker='"crossReferenceCatalog":'
          i=s.find(marker)
          if i>=0:
            start=i+len(marker)
            decoder=json.JSONDecoder()
            obj,end=decoder.raw_decode(s[start:])
            print('===== CROSS REFERENCE CATALOG =====')
            for key,v in obj.items():
              print(json.dumps({'key':key,**{k:v.get(k) for k in ['id','title','type','organization','apa','url','linkType','actionLabel']}},ensure_ascii=False))
          else:
            print('MISSING crossReferenceCatalog')
          PY
