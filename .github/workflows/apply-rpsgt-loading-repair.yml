name: Apply sleep technologist storefront polish

on:
  push:
    paths:
      - '.github/workflows/apply-rpsgt-loading-repair.yml'

permissions:
  contents: write

jobs:
  storefront-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply storefront polish
        run: python scripts/one_time_storefront_polish.py

      - name: Run SEO audit
        run: python scripts/seo_audit.py --site-url https://sleeppathwaysguild.com

      - name: Run link audit
        run: python scripts/link_audit.py --site-url https://sleeppathwaysguild.com

      - name: Restore helper and remove one-time script
        shell: bash
        run: |
          cat > .github/workflows/apply-rpsgt-loading-repair.yml <<'EOF'
          name: Apply RPSGT loading repair

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            disabled:
              if: false
              runs-on: ubuntu-latest
              steps:
                - run: echo 'Superseded by the verified browser loader deployment.'
          EOF
          rm -f scripts/one_time_storefront_polish.py

      - name: Commit verified storefront polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: polish sleep technologist storefront and curated gear shelves'
          git push
