name: Apply RPSGT loading repair

on:
  push:
    branches:
      - build/affiliate-link-wording-20260910

permissions:
  contents: read

jobs:
  inspect-affiliate-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/affiliate-link-wording-20260910
      - name: Inspect CPSGT affiliate helper
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('cpsgt-study-app.html').read_text(encoding='utf-8')
          marker = 'function cpsgtAffiliateActionHtml('
          start = text.index(marker)
          end = text.find('\nfunction ', start + len(marker))
          if end < 0:
              end = min(len(text), start + 5000)
          print(text[start:end])
          PY
