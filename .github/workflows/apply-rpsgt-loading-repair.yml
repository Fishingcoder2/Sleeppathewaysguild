name: Apply BRPT bookstore expansion

on:
  push:
    paths:
      - '.github/workflows/apply-rpsgt-loading-repair.yml'

permissions:
  contents: write

jobs:
  bookstore-expansion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand BRPT bookstore coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('rpsgt-exam-prep-books.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once('<title>RPSGT Exam Prep Books & Sleep Technology Textbooks | SPG</title>', '<title>BRPT Exam Prep Books: RPSGT, CPSGT, CCSH & Certificates | SPG</title>', 'title')
          replace_once('<meta name="description" content="Explore 14 curated RPSGT exam prep books, polysomnography textbooks, pediatric sleep references, respiratory resources, ECG books, and free Guild study tools.">', '<meta name="description" content="Browse BRPT-listed books and approved references for RPSGT, CPSGT, CCSH, Pediatric Sleep and Advanced Titration, plus current sleep technology texts.">', 'description')
          replace_once('<meta property="og:title" content="RPSGT Exam Prep Books & Sleep Technology Textbooks">', '<meta property="og:title" content="BRPT Exam Prep Books for RPSGT, CPSGT, CCSH & Certificates">', 'og title')
          replace_once('<meta property="og:description" content="A cover-first curated bookstore for RPSGT learners, polysomnography students, and sleep technologists.">', '<meta property="og:description" content="Credential-by-credential sleep technology books for RPSGT, CPSGT, CCSH, Pediatric Sleep, and Advanced Titration preparation.">', 'og description')
          replace_once('<meta name="twitter:title" content="RPSGT Exam Prep Books & Sleep Technology Textbooks">', '<meta name="twitter:title" content="BRPT Exam Prep Books for RPSGT, CPSGT, CCSH & Certificates">', 'twitter title')
          replace_once('<meta name="twitter:description" content="Curated RPSGT, polysomnography, pediatric sleep, respiratory, and ECG references from Sleep Pathways Guild.">', '<meta name="twitter:description" content="Curated BRPT exam and certificate references for sleep technologists, with official-source links and current editions.">', 'twitter description')

          schema_match = re.search(r'<script type="application/ld\+json">\n(.*?)\n</script>', text, re.S)
          if not schema_match:
              raise SystemExit('JSON-LD block not found')
          schema = json.loads(schema_match.group(1))
          titles = [
              'Fundamentals for Sleep Professionals',
              'Fundamentals of Sleep Technology',
              'Fundamentals of Sleep Technology Workbook',
              'Polysomnography for the Sleep Technologist',
              'Fundamentals of Sleep Medicine',
              'Sleep Disorders Medicine',
              'A Clinical Guide to Pediatric Sleep',
              'Sleep Medicine Pearls',
              'Pediatric Sleep Pearls',
              'Principles and Practice of Pediatric Sleep Medicine',
              'ERS Handbook of Respiratory Sleep Medicine',
              'Handbook of Sleep Medicine',
              'Atlas of Sleep Medicine',
              "The Only EKG Book You'll Ever Need",
              'Sleep Disorders and Sleep Promotion in Nursing Practice',
              'Essentials of Patient Education',
              "Kryger's Sleep Medicine Review",
              'Mask Interfaces for Noninvasive Mechanical Ventilation',
              'Upper Airway Stimulation in Obstructive Sleep Apnea',
          ]
          for node in schema.get('@graph', []):
              if node.get('@type') == 'WebPage':
                  node['name'] = 'BRPT Exam Prep Books for RPSGT, CPSGT, CCSH & Certificates'
                  node['description'] = 'A curated guide to BRPT-listed credential exam books, certificate references, current sleep technology texts, and official AASM and BRPT resources.'
                  node['dateModified'] = '2026-09-09'
              elif node.get('@type') == 'BreadcrumbList':
                  if len(node.get('itemListElement', [])) >= 2:
                      node['itemListElement'][1]['name'] = 'BRPT Exam Prep Books & Certificate References'
              elif node.get('@type') == 'ItemList':
                  node['name'] = 'BRPT exam prep and sleep technology books'
                  node['numberOfItems'] = len(titles)
                  node['itemListElement'] = [
                      {'@type': 'ListItem', 'position': i, 'name': title}
                      for i, title in enumerate(titles, 1)
                  ]
              elif node.get('@type') == 'FAQPage':
                  node['mainEntity'] = [
                      {'@type':'Question','name':'Does BRPT recommend one book for every credential exam?','acceptedAnswer':{'@type':'Answer','text':'No. BRPT publishes non-exclusive recommended reading lists and advises candidates to choose current resources based on the exam blueprint, their experience, and educational needs.'}},
                      {'@type':'Question','name':'Are the Pediatric Sleep and Advanced Titration programs BRPT credentials?','acceptedAnswer':{'@type':'Answer','text':'No. They are assessment-based certificate programs that award digital badges. They do not add a professional designation after a holder’s name.'}},
                      {'@type':'Question','name':'Do these books replace the current AASM Scoring Manual or BRPT exam information?','acceptedAnswer':{'@type':'Answer','text':'No. Textbooks support understanding and review. Current official AASM, BRPT, AAST, employer, and clinical requirements remain controlling for version-sensitive information.'}},
                  ]
          new_schema = json.dumps(schema, ensure_ascii=False, separators=(',', ':'))
          text = text[:schema_match.start(1)] + new_schema + text[schema_match.end(1):]

          hero_old = '<section class="hero"><div class="wrap heroGrid"><div class="heroMain"><span class="eyebrow">Curated by Sleep Pathways Guild</span><h1>Books for sleep technologists.</h1><p>A specialty shelf for RPSGT learners, polysomnography students, working technologists, and educators. Start with your weakest area, choose one useful reference, and keep current standards beside it.</p><div class="actions"><a class="btn gold" href="#start">Browse the shelves</a><a class="btn light" href="/RPSGTv2.2026.html">Use the free RPSGT study app</a></div></div><aside class="heroAside"><div><span class="eyebrow" style="color:#2a6761">Free before paid</span><h2>Find the gap before buying the book.</h2><p>Use the Guild study tools first. Then choose a textbook because it adds depth—not because buying a book is required to begin.</p></div><div class="disclosure"><strong>Affiliate disclosure:</strong> As an Amazon Associate, Sleep Pathways Guild may earn from qualifying purchases at no additional cost to you. Affiliate tracking remains inside the purchase link and is not displayed as learner-facing content.</div></aside></div></section>'
          hero_new = '<section class="hero"><div class="wrap heroGrid"><div class="heroMain"><span class="eyebrow">Curated by Sleep Pathways Guild</span><h1>Books for every BRPT pathway.</h1><p>Browse sleep technology references by RPSGT, CPSGT, CCSH, Pediatric Sleep Certificate, and Advanced Titration Certificate. BRPT reading lists are non-exclusive, so use the current exam blueprint and official standards as your guide.</p><div class="actions"><a class="btn gold" href="#credentials">Choose your exam or certificate</a><a class="btn light" href="/RPSGTv2.2026.html">Use the free RPSGT study app</a></div></div><aside class="heroAside"><div><span class="eyebrow" style="color:#2a6761">Official source first</span><h2>Know why a title is on the shelf.</h2><p>Gold BRPT labels identify titles that appear on a current BRPT recommended or approved reference list. When a newer edition is shown, the card says so. Certificate resources are kept separate from professional credentials.</p></div><div class="disclosure"><strong>Affiliate disclosure:</strong> As an Amazon Associate, Sleep Pathways Guild may earn from qualifying purchases at no additional cost to you. Inclusion on a BRPT reading list does not constitute endorsement by BRPT.</div></aside></div></section>'
          replace_once(hero_old, hero_new, 'hero')

          jump_old = '<div class="jumpbar"><div class="wrap jumpchips"><a href="#start">Start Here</a><a href="#technical">Technical & PSG</a><a href="#pediatric">Pediatric & Cases</a><a href="#specialty">Respiratory, Visual & ECG</a><a href="#guide">How to choose</a></div></div>'
          jump_new = '<div class="jumpbar"><div class="wrap jumpchips"><a href="#credentials">Choose Pathway</a><a href="#start">Core Books</a><a href="#technical">Technical & PSG</a><a href="#pediatric">Pediatric Sleep</a><a href="#ccsh">CCSH</a><a href="#advanced-titration">Advanced Titration</a><a href="#specialty">Specialty</a><a href="#official">Official Manuals</a><a href="#guide">How to choose</a></div></div>'
          replace_once(jump_old, jump_new, 'jumpbar')

          credentials = '''<section class="seoBlock wrap" id="credentials"><span class="eyebrow" style="color:#8a6910">Find your pathway</span><h2>BRPT credentials and assessment-based certificates</h2><p>Use these shortcuts to find the books most relevant to your goal. BRPT describes its reading lists as preparation resources rather than required purchases, and inclusion does not constitute BRPT endorsement.</p><div class="seoGrid">
          <article><h3>RPSGT credential exam</h3><p>Core sleep technology, instrumentation, pediatric sleep, and case-based references. All five textbook titles on BRPT’s current RPSGT reading page are represented in this bookstore.</p><a class="btn outline" href="#start">Browse RPSGT books</a></article>
          <article><h3>CPSGT credential exam</h3><p>Foundational sleep technology, sleep medicine, disorders, pediatric sleep, plus the current AASM Scoring Manual and ICSD. Newer editions are shown where available.</p><a class="btn outline" href="#start">Browse CPSGT books</a></article>
          <article><h3>CCSH credential exam</h3><p>Clinical sleep health, patient education, sleep promotion, scenario-based review, and official standards. This expansion adds the major CCSH titles that were missing.</p><a class="btn outline" href="#ccsh">Browse CCSH books</a></article>
          <article><h3>Pediatric Sleep Certificate</h3><p>An assessment-based certificate and digital badge for eligible active RPSGT or CCSH holders. Use the pediatric shelf with BRPT’s official certificate page and linked reference-book list.</p><a class="btn outline" href="#pediatric">Browse pediatric resources</a></article>
          <article><h3>Advanced Titration Certificate</h3><p>An assessment-based certificate and digital badge for eligible active RPSGT or CCSH holders. The bookstore now includes every textbook on BRPT’s approved ATC reference PDF.</p><a class="btn outline" href="#advanced-titration">Browse ATC books</a></article>
          <article><h3>Official manuals & standards</h3><p>The AASM Scoring Manual, ICSD-3-TR, and BRPT reading pages belong beside textbooks because exam preparation includes version-sensitive official sources.</p><a class="btn outline" href="#official">Open official resources</a></article>
          </div></section>
          '''
          marker = '<section class="shelf" id="start">'
          if marker not in text:
              raise SystemExit('start shelf marker not found')
          text = text.replace(marker, credentials + marker, 1)

          replace_once('<div class="badges"><span class="badge gold">BRPT-listed title</span><span class="badge">RPSGT core</span></div>', '<div class="badges"><span class="badge gold">BRPT: RPSGT · CPSGT · CCSH · ATC</span><span class="badge">Core technology</span></div>', 'FST badges')
          replace_once('<div class="badges"><span class="badge gold">Current edition</span><span class="badge">Foundational medicine</span></div>', '<div class="badges"><span class="badge gold">Current edition of BRPT CPSGT-listed title</span><span class="badge">Foundational medicine</span></div>', 'fundamentals medicine badges')
          replace_once('<div class="badges"><span class="badge gold">BRPT-listed title</span><span class="badge">Clinical depth</span></div>', '<div class="badges"><span class="badge gold">Current edition of BRPT CPSGT / CCSH title</span><span class="badge">Clinical depth</span></div>', 'sleep disorders badges')
          replace_once('<div class="badges"><span class="badge gold">BRPT-listed title</span><span class="badge">Pediatrics</span></div>', '<div class="badges"><span class="badge gold">BRPT: RPSGT · CPSGT</span><span class="badge">Pediatrics</span></div>', 'clinical guide badges')
          replace_once('<div class="badges"><span class="badge gold">BRPT RPSGT-listed</span><span class="badge">Clinical cases</span></div>', '<div class="badges"><span class="badge gold">BRPT: RPSGT · CCSH · ATC</span><span class="badge">Clinical cases</span></div>', 'sleep pearls badges')
          replace_once('<div class="badges"><span class="badge">Pediatrics</span><span class="badge">Advanced depth</span></div>', '<div class="badges"><span class="badge gold">BRPT ATC-approved</span><span class="badge">Pediatrics · advanced depth</span></div>', 'pediatric principles badges')

          peds_head_old = '<section class="shelf" id="pediatric"><div class="wrap"><div class="shelfHead"><div><span class="eyebrow" style="color:#8a6910">Pediatric & case-based learning</span><h2>Strengthen pediatric and clinical reasoning</h2><p>Development, family-centered care, pediatric PSG context, case interpretation, and disorder recognition.</p></div></div><div class="bookGrid">'
          peds_head_new = '<section class="shelf" id="pediatric"><div class="wrap"><div class="shelfHead"><div><span class="eyebrow" style="color:#8a6910">Pediatric Sleep Certificate + pediatric exam content</span><h2>Strengthen pediatric and clinical reasoning</h2><p>Development, family-centered care, pediatric PSG context, scoring, case interpretation, and treatment. BRPT links a separate reference-books document from its Pediatric Sleep Certificate page; use that official page as the controlling certificate source.</p></div><a class="btn outline" href="https://brpt.org/pediatric-sleep-certificate-exam/" target="_blank" rel="noopener noreferrer">BRPT Pediatric Certificate</a></div><div class="bookGrid">'
          replace_once(peds_head_old, peds_head_new, 'pediatric heading')

          ccsh_atc = '''<section class="shelf" id="ccsh"><div class="wrap"><div class="shelfHead"><div><span class="eyebrow" style="color:#8a6910">CCSH credential exam</span><h2>Clinical sleep health, education, and scenario review</h2><p>These additions fill the biggest gaps between the existing bookstore and BRPT’s current CCSH Recommended Readings page. Existing CCSH-listed titles elsewhere on this page include Fundamentals of Sleep Technology, Sleep Disorders Medicine, and Sleep Medicine Pearls.</p></div><a class="btn outline" href="https://brpt.org/ccsh/recommended-readings/" target="_blank" rel="noopener noreferrer">BRPT CCSH readings</a></div><div class="bookGrid">
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">Sleep Disorders and Sleep Promotion in Nursing Practice</div></div><h3 class="bookTitle">Sleep Disorders and Sleep Promotion in Nursing Practice</h3><div class="bookAuthor">Redeker & McEnany · eds.</div><div class="badges"><span class="badge gold">BRPT CCSH-listed</span><span class="badge">Sleep health & promotion</span></div><p class="best"><strong>Best for:</strong> Sleep assessment, health promotion, lifespan sleep, patient care, and clinical sleep-health context.</p><details><summary>Study notes & citation</summary><div class="detail">A nursing and health-promotion perspective spanning normal sleep, disorders, assessment, treatment, and care settings. ISBN 9780826106575.<br><br><cite>Redeker, N. S., & McEnany, G. P. (Eds.). (2011). <em>Sleep disorders and sleep promotion in nursing practice</em>. Springer Publishing Company.</cite></div></details><a class="btn gold" href="https://www.amazon.com/dp/0826106579?tag=spg_rpsgt-20" target="_blank" rel="sponsored noopener noreferrer">Check Amazon</a></article>
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">Essentials of Patient Education · 2nd ed.</div></div><h3 class="bookTitle">Essentials of Patient Education</h3><div class="bookAuthor">Bastable · 2nd ed.</div><div class="badges"><span class="badge gold">BRPT CCSH-listed</span><span class="badge">Patient education</span></div><p class="best"><strong>Best for:</strong> Communication, teaching plans, health literacy, learning needs, behavior, and evaluating education.</p><details><summary>Study notes & citation</summary><div class="detail">Patient education foundations, learning theories, literacy, culture, objectives, teaching methods, technology, and evaluation. ISBN 9781284104448.<br><br><cite>Bastable, S. B. (Ed.). (2017). <em>Essentials of patient education</em> (2nd ed.). Jones & Bartlett Learning.</cite></div></details><a class="btn gold" href="https://www.amazon.com/dp/1284104443?tag=spg_rpsgt-20" target="_blank" rel="sponsored noopener noreferrer">Check Amazon</a></article>
          <article class="bookCard"><div class="coverWrap"><img src="https://secure-ecsd.elsevier.com/covers/80/Tango2/large/9780323654173.jpg" data-fallback="https://covers.openlibrary.org/b/isbn/9780323654173-L.jpg?default=false" alt="Kryger's Sleep Medicine Review third edition book cover" loading="lazy"></div><h3 class="bookTitle">Kryger's Sleep Medicine Review</h3><div class="bookAuthor">Kryger, Rosenberg & Kirsch · 3rd ed.</div><div class="badges"><span class="badge gold">Current edition of BRPT CCSH-listed review</span><span class="badge">Scenario & question review</span></div><p class="best"><strong>Best for:</strong> Problem-oriented review, instrumentation, disorders, scoring context, and applied questions.</p><details><summary>Study notes & citation</summary><div class="detail">The current third edition of the problem-oriented sleep medicine review title represented on BRPT’s CCSH list. ISBN 9780323654173.<br><br><cite>Kryger, M. H., Rosenberg, R., & Kirsch, D. (2019). <em>Kryger's sleep medicine review: A problem-oriented approach</em> (3rd ed.). Elsevier.</cite></div></details><a class="btn gold" href="https://www.amazon.com/dp/0323654177?tag=spg_rpsgt-20" target="_blank" rel="sponsored noopener noreferrer">Check Amazon</a></article>
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">The Clinical Sleep Health Professional Workbook · AAST · 2019</div></div><h3 class="bookTitle">The Clinical Sleep Health Professional Workbook</h3><div class="bookAuthor">AAST · 2019</div><div class="badges"><span class="badge gold">BRPT CCSH-listed resource</span><span class="badge">Official professional resource</span></div><p class="best"><strong>Best for:</strong> Clinical sleep-health preparation alongside textbooks and current guidelines.</p><details><summary>Why it is here</summary><div class="detail">BRPT’s current CCSH Recommended Readings page lists this AAST workbook. Availability and access can change, so use BRPT’s current reading page rather than an affiliate link.</div></details><a class="btn outline" href="https://brpt.org/ccsh/recommended-readings/" target="_blank" rel="noopener noreferrer">Open BRPT listing</a></article>
          </div></div></section>

          <section class="shelf" id="advanced-titration"><div class="wrap"><div class="shelfHead"><div><span class="eyebrow" style="color:#2a6761">Advanced Titration Certificate</span><h2>Every textbook on BRPT’s approved ATC reference list</h2><p>BRPT’s approved Advanced Titration reference PDF names five textbooks. Three are already shelved above—Fundamentals of Sleep Technology, Sleep Medicine Pearls, and Principles and Practice of Pediatric Sleep Medicine. These two additions complete the textbook set.</p></div><a class="btn outline" href="https://brpt.org/advanced-titration-certificate-exam/" target="_blank" rel="noopener noreferrer">BRPT ATC exam page</a></div><div class="bookGrid">
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">Mask Interfaces for Noninvasive Mechanical Ventilation · 2022</div></div><h3 class="bookTitle">Mask Interfaces for Noninvasive Mechanical Ventilation</h3><div class="bookAuthor">Esquinas · 2022</div><div class="badges"><span class="badge gold">BRPT ATC-approved text</span><span class="badge">Interfaces · NIV</span></div><p class="best"><strong>Best for:</strong> Interface selection, fit, leak, comfort, ventilation delivery, and noninvasive respiratory support.</p><details><summary>Study notes & citation</summary><div class="detail">Technology and clinical-practice principles for mask interfaces used with noninvasive mechanical ventilation. ISBN 9781685076306.<br><br><cite>Esquinas, A. M. (Ed.). (2022). <em>Mask interfaces for noninvasive mechanical ventilation: Principles of technology and clinical practice</em>. Nova Science Publishers.</cite></div></details><a class="btn gold" href="https://www.amazon.com/dp/1685076300?tag=spg_rpsgt-20" target="_blank" rel="sponsored noopener noreferrer">Check Amazon</a></article>
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">Upper Airway Stimulation in Obstructive Sleep Apnea · 2022</div></div><h3 class="bookTitle">Upper Airway Stimulation in Obstructive Sleep Apnea</h3><div class="bookAuthor">Heiser & de Vries · eds. · 2022</div><div class="badges"><span class="badge gold">BRPT ATC-approved text</span><span class="badge">Upper-airway stimulation</span></div><p class="best"><strong>Best for:</strong> Understanding patient evaluation, surgical management, and upper-airway stimulation therapy for OSA.</p><details><summary>Study notes & citation</summary><div class="detail">Best practices in evaluation and surgical management of upper-airway stimulation for obstructive sleep apnea. ISBN 9783030895037.<br><br><cite>Heiser, C., & de Vries, N. (Eds.). (2022). <em>Upper airway stimulation in obstructive sleep apnea: Best practices in evaluation and surgical management</em>. Springer.</cite></div></details><a class="btn gold" href="https://www.amazon.com/dp/3030895033?tag=spg_rpsgt-20" target="_blank" rel="sponsored noopener noreferrer">Check Amazon</a></article>
          </div><div class="seoBlock" style="margin:18px 0 0"><h2 style="font-size:1.35rem">Also on the BRPT ATC approved-text list</h2><p><strong>Fundamentals of Sleep Technology, 3rd ed.</strong> is in the core shelf above. <strong>Sleep Medicine Pearls, 3rd ed.</strong> and <strong>Principles and Practice of Pediatric Sleep Medicine, 2nd ed.</strong> are in the pediatric shelf. BRPT’s official ATC reference document also includes clinical guidelines and articles beyond these five textbooks.</p></div></div></section>

          '''
          marker2 = '<section class="shelf" id="specialty">'
          if marker2 not in text:
              raise SystemExit('specialty marker not found')
          text = text.replace(marker2, ccsh_atc + marker2, 1)

          official = '''<section class="shelf" id="official"><div class="wrap"><div class="shelfHead"><div><span class="eyebrow" style="color:#8a6910">Version-sensitive official sources</span><h2>Manuals, classifications, and BRPT reading lists</h2><p>These are not substitutes for textbooks; they are the official references that keep exam preparation current when rules, terminology, diagnostic criteria, or credential requirements change.</p></div></div><div class="bookGrid">
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">AASM Manual for the Scoring of Sleep and Associated Events</div></div><h3 class="bookTitle">AASM Scoring Manual</h3><div class="bookAuthor">American Academy of Sleep Medicine</div><div class="badges"><span class="badge gold">BRPT RPSGT · CPSGT · CCSH source</span><span class="badge">Official manual</span></div><p class="best"><strong>Best for:</strong> Current scoring rules, terminology, montages, event definitions, and technical specifications.</p><a class="btn outline" href="https://aasm.org/clinical-resources/scoring-manual/" target="_blank" rel="noopener noreferrer">Open AASM Scoring Manual</a></article>
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">International Classification of Sleep Disorders · ICSD-3-TR</div></div><h3 class="bookTitle">International Classification of Sleep Disorders</h3><div class="bookAuthor">AASM · current ICSD-3-TR</div><div class="badges"><span class="badge gold">BRPT RPSGT · CPSGT · CCSH source</span><span class="badge">Official classification</span></div><p class="best"><strong>Best for:</strong> Current diagnostic categories, criteria, terminology, and coding context. BRPT pages may name the earlier third edition; AASM’s current text is ICSD-3-TR.</p><a class="btn outline" href="https://aasm.org/clinical-resources/international-classification-sleep-disorders/" target="_blank" rel="noopener noreferrer">Open current ICSD</a></article>
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">BRPT Credential Recommended Readings</div></div><h3 class="bookTitle">BRPT Credential Reading Lists</h3><div class="bookAuthor">RPSGT · CPSGT · CCSH</div><div class="badges"><span class="badge gold">Official BRPT pages</span><span class="badge">Check before buying</span></div><p class="best"><strong>Best for:</strong> Confirming what BRPT currently identifies as suggested preparation material.</p><div class="actions"><a class="btn outline" href="https://brpt.org/rpsgt/recommended-readings/" target="_blank" rel="noopener noreferrer">RPSGT</a><a class="btn outline" href="https://brpt.org/cpsgt/recommended-readings/" target="_blank" rel="noopener noreferrer">CPSGT</a><a class="btn outline" href="https://brpt.org/ccsh/recommended-readings/" target="_blank" rel="noopener noreferrer">CCSH</a></div></article>
          <article class="bookCard"><div class="coverWrap"><div class="coverFallback">BRPT Certificate & Digital Badge Resources</div></div><h3 class="bookTitle">BRPT Certificate Reference Pages</h3><div class="bookAuthor">Pediatric Sleep · Advanced Titration</div><div class="badges"><span class="badge gold">Assessment-based certificates</span><span class="badge">Digital badges</span></div><p class="best"><strong>Best for:</strong> Verifying eligibility, blueprints, reference lists, and current certificate requirements directly with BRPT.</p><div class="actions"><a class="btn outline" href="https://brpt.org/pediatric-sleep-certificate-exam/" target="_blank" rel="noopener noreferrer">Pediatric</a><a class="btn outline" href="https://brpt.org/advanced-titration-certificate-exam/" target="_blank" rel="noopener noreferrer">Advanced Titration</a></div></article>
          </div></div></section>

          '''
          guide_marker = '<section class="seoBlock wrap" id="guide">'
          if guide_marker not in text:
              raise SystemExit('guide marker not found')
          text = text.replace(guide_marker, official + guide_marker, 1)

          replace_once('<section class="seoBlock wrap" id="guide"><span class="eyebrow" style="color:#8a6910">How to choose</span><h2>Buy for the learning gap, not for the size of the shelf.</h2><p>RPSGT preparation is stronger when a book has a clear job. A broad reference can anchor your study plan, while a technical, pediatric, respiratory, visual, or ECG title can deepen a specific weak area.</p>', '<section class="seoBlock wrap" id="guide"><span class="eyebrow" style="color:#8a6910">How to choose</span><h2>Buy for the learning gap, not for the size of the shelf.</h2><p>Start with your BRPT blueprint and official references, then choose a book with a clear job. RPSGT, CPSGT, CCSH, Pediatric Sleep, and Advanced Titration preparation overlap, but each pathway emphasizes different knowledge and application.</p>', 'guide intro')
          replace_once('<section class="authority wrap"><h2>Books support study. Current standards still control.</h2><p>For version-sensitive scoring rules, credential requirements, technical specifications, and professional guidance, verify against the current official source. Sleep Pathways Guild does not reproduce proprietary examination questions or substitute textbooks for current AASM, BRPT, AAST, employer, or clinical requirements.</p>', '<section class="authority wrap"><h2>Books support study. Current standards still control.</h2><p>For version-sensitive scoring rules, credential and certificate requirements, technical specifications, and professional guidance, verify against the current official source. BRPT states that its reading lists are not all-inclusive and that inclusion does not constitute endorsement. Sleep Pathways Guild does not reproduce proprietary examination questions or substitute textbooks for current AASM, BRPT, AAST, employer, or clinical requirements.</p>', 'authority')
          replace_once('Last reviewed September 4, 2026 · © 2026 Sleep Pathways Guild', 'Last reviewed September 9, 2026 · © 2026 Sleep Pathways Guild', 'review date')

          # Sanity checks for the expanded catalog.
          required = [
              'id="credentials"', 'id="ccsh"', 'id="advanced-titration"', 'id="official"',
              'Sleep Disorders and Sleep Promotion in Nursing Practice',
              'Essentials of Patient Education', "Kryger's Sleep Medicine Review",
              'Mask Interfaces for Noninvasive Mechanical Ventilation',
              'Upper Airway Stimulation in Obstructive Sleep Apnea',
              'numberOfItems":19',
          ]
          missing = [item for item in required if item not in text]
