name: Apply RPSGT loading repair

on:
  push:
    branches:
      - build/affiliate-link-wording-20260910

permissions:
  contents: read

jobs:
  inspect-legacy-reference-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/affiliate-link-wording-20260910
      - name: Inspect legacy reference renderers and canonical book keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('RPSGTv2.2026.html').read_text(encoding='utf-8')
          markers=['function renderRefs','function referenceResourceCards','function referencePreviewCards','function refsRows','function resourcesFromKeys','function resourcesForDomainTask','function resourceChipHtml','function brptOfficialResourcesHtml']
          funcs=list(re.finditer(r'function\s+([A-Za-z_$][\w$]*)\s*\(',text))
          starts={m.group(1):m.start() for m in funcs}
          sorted_starts=sorted((m.start(),m.group(1)) for m in funcs)
          for marker in markers:
              name=marker.replace('function ','')
              start=starts.get(name,-1)
              print('\n===== ',name,' =====')
              if start<0:
                  print('MISSING')
                  continue
              end=len(text)
              for pos,fn in sorted_starts:
                  if pos>start:
                      end=pos
                      break
              print(text[start:min(end,start+12000)])
          titles=['Fundamentals of Sleep Technology','Polysomnography for the Sleep Technologist','A Clinical Guide to Pediatric Sleep','Sleep Medicine Pearls','Pediatric Sleep Pearls','Principles and Practice of Pediatric Sleep Medicine']
          for title in titles:
              print('\n===== TITLE',title,'=====')
              pos=0; count=0
              while count<8:
                  pos=text.find(title,pos)
                  if pos<0: break
                  print(text[max(0,pos-700):min(len(text),pos+1300)])
                  pos += len(title); count += 1
              print('occurrences shown',count)
          PY
