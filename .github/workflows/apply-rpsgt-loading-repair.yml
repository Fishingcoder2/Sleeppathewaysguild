name: Apply BRPT terminology cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-rpsgt-loading-repair.yml'

permissions:
  contents: write

jobs:
  terminology-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize BRPT bookstore terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rpsgt-exam-prep-books.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('Browse BRPT-listed books and approved references for RPSGT, CPSGT, CCSH, Pediatric Sleep and Advanced Titration, plus current sleep technology texts.',
               'Browse BRPT Recommended Readings, Approved ATC References, and current sleep technology books for RPSGT, CPSGT, CCSH, and certificate preparation.'),
              ('A curated guide to BRPT-listed credential exam books, certificate references, current sleep technology texts, and official AASM and BRPT resources.',
               'A curated guide to BRPT Recommended Readings, Approved ATC References, current sleep technology texts, and official AASM and BRPT resources.'),
              ('Gold BRPT labels identify titles that appear on a current BRPT recommended or approved reference list.',
               'Gold BRPT labels distinguish BRPT Recommended Reading for credential exams from BRPT Approved ATC References.'),
              ('<span class="badge gold">BRPT: RPSGT · CPSGT · CCSH · ATC</span>',
               '<span class="badge gold">BRPT Recommended Reading: RPSGT · CPSGT · CCSH</span><span class="badge gold">BRPT Approved ATC Reference</span>'),
              ('Current edition of BRPT CPSGT-listed title', 'Current edition of BRPT CPSGT Recommended Reading'),
              ('Current edition of BRPT CPSGT / CCSH title', 'Current edition of BRPT CPSGT / CCSH Recommended Reading'),
              ('BRPT RPSGT-listed', 'BRPT RPSGT Recommended Reading'),
              ('<span class="badge gold">BRPT: RPSGT · CPSGT</span>', '<span class="badge gold">BRPT Recommended Reading: RPSGT · CPSGT</span>'),
              ('<span class="badge gold">BRPT: RPSGT · CCSH · ATC</span>',
               '<span class="badge gold">BRPT Recommended Reading: RPSGT · CCSH</span><span class="badge gold">BRPT Approved ATC Reference</span>'),
              ('BRPT ATC-approved', 'BRPT Approved ATC Reference'),
              ('Existing CCSH-listed titles elsewhere on this page include', 'Existing BRPT CCSH Recommended Readings elsewhere on this page include'),
              ('BRPT CCSH-listed', 'BRPT CCSH Recommended Reading'),
              ('Current edition of BRPT CCSH-listed review', 'Current edition of BRPT CCSH Recommended Reading'),
              ('BRPT CCSH-listed resource', 'BRPT CCSH Recommended Reading'),
              ('BRPT ATC-approved text', 'BRPT Approved ATC Reference'),
          ]

          changed = 0
          for old, new in replacements:
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  changed += count
                  print(f'replaced {count}: {old[:70]}')

          if changed < 10:
              raise SystemExit(f'Expected at least 10 terminology replacements, got {changed}')

          forbidden = [
              'BRPT-listed',
              'BRPT RPSGT-listed',
              'BRPT CCSH-listed',
              'BRPT ATC-approved',
              'BRPT ATC-approved text',
          ]
          leftovers = [term for term in forbidden if term in text]
          if leftovers:
              raise SystemExit(f'Legacy BRPT label wording remains: {leftovers}')

          required = [
              'BRPT Recommended Reading',
              'BRPT Approved ATC Reference',
              'inclusion does not constitute BRPT endorsement',
          ]
          missing = [term for term in required if term not in text]
          if missing:
              raise SystemExit(f'Required wording missing: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run SEO audit
        run: python scripts/seo_audit.py --site-url https://sleeppathwaysguild.com

      - name: Run link audit
        run: python scripts/link_audit.py --site-url https://sleeppathwaysguild.com

      - name: Restore disabled helper workflow
        shell: bash
        run: |
          cat > .github/workflows/apply-rpsgt-loading-repair.yml <<'EOF'
          name: Apply RPSGT loading repair

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            disabled:
              if: false
              runs-on: ubuntu-latest
              steps:
                - run: echo 'Superseded by the verified browser loader deployment.'
          EOF

      - name: Commit verified terminology cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpsgt-exam-prep-books.html .github/workflows/apply-rpsgt-loading-repair.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use precise BRPT reading terminology'
          git push
