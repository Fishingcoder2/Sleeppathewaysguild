name: Apply bookstore shop and gear expansion

on:
  push:
    paths:
      - '.github/workflows/apply-rpsgt-loading-repair.yml'

permissions:
  contents: write

jobs:
  shop-gear-expansion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shop and gear patch
        run: python scripts/one_time_shop_gear.py

      - name: Run SEO audit
        run: python scripts/seo_audit.py --site-url https://sleeppathwaysguild.com

      - name: Run link audit
        run: python scripts/link_audit.py --site-url https://sleeppathwaysguild.com

      - name: Restore helper and remove one-time script
        shell: bash
        run: |
          git show 39e5b89cf2c598b7ab29d104dead82f38be41d7e:.github/workflows/apply-rpsgt-loading-repair.yml > .github/workflows/apply-rpsgt-loading-repair.yml
          rm -f scripts/one_time_shop_gear.py

      - name: Commit verified shop and gear expansion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add sleep tech gear shop and affiliate search'
          git push
