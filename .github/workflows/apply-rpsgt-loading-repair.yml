name: Apply RPSGT loading repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rpsgt-loading-repair.yml'

permissions:
  contents: write

jobs:
  seo-metadata-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SEO metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cpsgt = Path('cpsgt-study-app.html')
          text = cpsgt.read_text(encoding='utf-8')
          needle = '<meta property="og:locale" content="en_US">\n<meta name="twitter:card" content="summary">\n'
          replacement = (
              '<meta property="og:locale" content="en_US">\n'
              '<meta property="og:image" content="https://sleeppathwaysguild.com/assets/branding/spg-guild-badge.png">\n'
              '<meta property="og:image:alt" content="Sleep Pathways Guild badge">\n'
              '<meta name="twitter:card" content="summary_large_image">\n'
              '<meta name="twitter:image" content="https://sleeppathwaysguild.com/assets/branding/spg-guild-badge.png">\n'
          )
          if needle not in text:
              raise SystemExit('CPSGT metadata anchor not found; refusing broad edit')
          cpsgt.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          flash = Path('flashcards.2026.html')
          text = flash.read_text(encoding='utf-8')
          old = 'Free EKG Flashcards for Sleep Technologists | Sleep Pathways Guild'
          new = 'Free EKG Flashcards for Sleep Techs | Sleep Pathways Guild'
          count = text.count(old)
          if count < 4:
              raise SystemExit(f'Expected at least 4 flashcard title occurrences, found {count}')
          flash.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run SEO audit
        run: python scripts/seo_audit.py --site-url https://sleeppathwaysguild.com

      - name: Run link audit
        run: python scripts/link_audit.py --site-url https://sleeppathwaysguild.com

      - name: Restore disabled helper workflow
        shell: bash
        run: |
          cat > .github/workflows/apply-rpsgt-loading-repair.yml <<'EOF'
          name: Apply RPSGT loading repair

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            disabled:
              if: false
              runs-on: ubuntu-latest
              steps:
                - run: echo 'Superseded by the verified browser loader deployment.'
          EOF

      - name: Commit metadata cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cpsgt-study-app.html flashcards.2026.html .github/workflows/apply-rpsgt-loading-repair.yml
          git diff --cached --check
          git commit -m 'fix: clean remaining SEO metadata warnings'
          git push origin HEAD:main
