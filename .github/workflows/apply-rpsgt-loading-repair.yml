name: Apply RPSGT loading repair

on:
  push:
    branches:
      - build/affiliate-link-wording-20260910

permissions:
  contents: read

jobs:
  inspect-cpsgt-book-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/affiliate-link-wording-20260910
      - name: Inspect CPSGT shelf action helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('cpsgt-study-app.html').read_text(encoding='utf-8')
          for needle in ['function bookPublicUrl','function bookCommerce','bookPublicUrl(book)','bookCommerce(book)','Official publisher','View exact publisher listing']:
              print('\n###', needle)
              pos = 0
              found = 0
              while True:
                  pos = text.find(needle,pos)
                  if pos < 0: break
                  found += 1
                  print(text[max(0,pos-900):min(len(text),pos+2200)])
                  pos += len(needle)
                  if found >= 5: break
              if not found: print('NOT FOUND')
          PY
