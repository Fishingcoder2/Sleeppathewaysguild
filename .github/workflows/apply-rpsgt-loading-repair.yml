name: CPSGT branch inspection

on:
  push:
    branches:
      - build/cpsgt-shared-affiliate-links-20260910

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate CPSGT book URL rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('cpsgt-study-app.html').read_text(encoding='utf-8')
          for term in ['book.url','bookIsAffiliate(','BOOK_RECOMMENDATIONS.filter','bookLinkDisclosure(','bookLinkAria(']:
            print('\n===== TERM:',term,'COUNT',s.count(term),'=====')
            start=0; found=0
            while True:
              i=s.find(term,start)
              if i<0: break
              found+=1
              print(f'--- match {found} at {i} ---')
              print(s[max(0,i-850):min(len(s),i+1500)])
              start=i+len(term)
          PY
