name: Validate RPSGT v3 source authority

on:
  push:
    branches:
      - build/rpsgt-v3-modular
    paths:
      - rpsgt-v3/data/study-sources/**
      - rpsgt-v3/data/authority/**
      - rpsgt-v3/data/question-bank/**
      - rpsgt-v3/core/study-resource-catalog.js
      - rpsgt-v3/scripts/test-study-source-authority.mjs
      - rpsgt-v3/scripts/test-study-resource-exact-resolution.mjs
      - rpsgt-v3/scripts/test-study-resource-bank-coverage.mjs
      - rpsgt-v3/scripts/test-drive-source-imports.mjs
      - rpsgt-v3/scripts/test-current-authority-registry.mjs
      - rpsgt-v3/scripts/audit-pending-source-key-cooccurrence.mjs
      - rpsgt-v3/scripts/test-icsd-taxonomy.mjs
      - rpsgt-v3/scripts/test-principles-practice-7e-locators.mjs
      - rpsgt-v3/scripts/test-brpt-master-reference-inventory.mjs
      - .github/workflows/rpsgt-v3-source-authority.yml
  pull_request:
    branches:
      - main
    paths:
      - rpsgt-v3/data/study-sources/**
      - rpsgt-v3/data/authority/**
      - rpsgt-v3/data/question-bank/**
      - rpsgt-v3/core/study-resource-catalog.js
      - rpsgt-v3/scripts/test-study-source-authority.mjs
      - rpsgt-v3/scripts/test-study-resource-exact-resolution.mjs
      - rpsgt-v3/scripts/test-study-resource-bank-coverage.mjs
      - rpsgt-v3/scripts/test-drive-source-imports.mjs
      - rpsgt-v3/scripts/test-current-authority-registry.mjs
      - rpsgt-v3/scripts/audit-pending-source-key-cooccurrence.mjs
      - rpsgt-v3/scripts/test-icsd-taxonomy.mjs
      - rpsgt-v3/scripts/test-principles-practice-7e-locators.mjs
      - rpsgt-v3/scripts/test-brpt-master-reference-inventory.mjs
      - .github/workflows/rpsgt-v3-source-authority.yml

jobs:
  validate-source-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/rpsgt-v3-modular
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate study-source authority and mappings
        run: node rpsgt-v3/scripts/test-study-source-authority.mjs
      - name: Validate exact question-to-source resolution
        run: node rpsgt-v3/scripts/test-study-resource-exact-resolution.mjs
      - name: Validate Drive-audited supplemental source imports
        run: node rpsgt-v3/scripts/test-drive-source-imports.mjs
      - name: Validate current authority registry and gap routing
        run: node rpsgt-v3/scripts/test-current-authority-registry.mjs
      - name: Audit study-resource coverage across full question bank
        run: node rpsgt-v3/scripts/test-study-resource-bank-coverage.mjs
      - name: Audit pending source-key co-occurrence
        run: node rpsgt-v3/scripts/audit-pending-source-key-cooccurrence.mjs
      - name: Validate ICSD diagnostic taxonomy and boundaries
        run: node rpsgt-v3/scripts/test-icsd-taxonomy.mjs
      - name: Validate Principles and Practice 7e printed locators
        run: node rpsgt-v3/scripts/test-principles-practice-7e-locators.mjs
      - name: Validate BRPT master reference inventory
        run: node rpsgt-v3/scripts/test-brpt-master-reference-inventory.mjs
