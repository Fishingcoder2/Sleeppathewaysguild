name: Assemble CPSGT Release

# Synchronization trigger for the CPSGT release PR.
on:
  push:
    branches:
      - release-cpsgt-webapp-2026-07-28
    paths:
      - '.cpsgt-release/**'
      - '.github/workflows/assemble-cpsgt-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-cpsgt-webapp-2026-07-28

      - name: Rebuild and verify standalone app
        shell: bash
        run: |
          set -euo pipefail
          cat .cpsgt-release/part-*.b64 | base64 --decode > /tmp/cpsgt-study-app.html.xz
          xz --decompress --stdout /tmp/cpsgt-study-app.html.xz > cpsgt-study-app.html
          test "$(wc -c < cpsgt-study-app.html)" -eq 7121905
          echo "fcc620264656cbad505c47a29c63de6d48a36a6db035330508f9ce7d0f57d239  cpsgt-study-app.html" | sha256sum --check --strict

      - name: Commit verified app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpsgt-study-app.html
          if git diff --cached --quiet; then
            echo "Verified app is already committed."
          else
            git commit -m "Add verified CPSGT Study Launchpad"
            git push origin HEAD:release-cpsgt-webapp-2026-07-28
          fi
