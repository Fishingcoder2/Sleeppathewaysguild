      - 'rpsgt-v3/scripts/test-memory-games-weak.mjs'
      - 'rpsgt-v3/scripts/test-memory-arcade.mjs'
      - 'rpsgt-v3/scripts/test-glossary-games.mjs'
      - 'rpsgt-v3/scripts/test-question-option-order.mjs'
      - 'rpsgt-v3/scripts/audit-aast-terminology-gaps.mjs'
      - '.github/workflows/rpsgt-v3-study-tools.yml'

permissions:
  contents: read

jobs:
  study-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate learner question retirement policy
        run: node rpsgt-v3/scripts/test-learner-question-retirements.mjs
      - name: Validate Math Coach engine and catalog
        run: node rpsgt-v3/scripts/test-math-coach-system.mjs
      - name: Validate Math Coach shell
        run: node rpsgt-v3/scripts/test-math-coach-shell.mjs
      - name: Validate Weak Memory and Math recall integration
        run: node rpsgt-v3/scripts/test-memory-games-weak.mjs
      - name: Validate Memory Arcade
        run: node rpsgt-v3/scripts/test-memory-arcade.mjs
      - name: Validate terminology Glossary Games
        run: node rpsgt-v3/scripts/test-glossary-games.mjs
      - name: Audit AAST terminology gaps
        run: node rpsgt-v3/scripts/audit-aast-terminology-gaps.mjs
      - name: Validate assessment answer option ordering
        run: node rpsgt-v3/scripts/test-question-option-order.mjs
      - name: Validate Visual and Review modal navigation
        run: node rpsgt-v3/scripts/test-visual-question-modal-ux.mjs
      - name: Validate shared visual display
        run: node rpsgt-v3/scripts/test-shared-visual-display.mjs
      - name: Validate Artifact modal navigation
        run: node rpsgt-v3/scripts/test-artifact-modal-ux.mjs
      - name: Check Scoring visual JavaScript syntax
        run: |
          node --check rpsgt-v3/core/scoring-stage-order.js
          node --check rpsgt-v3/core/lab-scoring-event-boundary.js
          node --check rpsgt-v3/core/scoring-event-boundary-engine.js
          node --check rpsgt-v3/core/scoring-event-boundary-renderer.js
      - name: Validate Scoring Lab engine and shell
        run: |
          node rpsgt-v3/scripts/test-scoring-lab-system.mjs
          node rpsgt-v3/scripts/test-scoring-lab-shell.mjs
      - name: Validate Scoring visual workflows
        run: |
          node rpsgt-v3/scripts/test-scoring-stage-presentation.mjs
          node rpsgt-v3/scripts/test-scoring-event-boundary.mjs
