name: Validate RPSGT v3 Respiratory Lab

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rpsgt-v3/lab-respiratory.html'
      - 'rpsgt-v3/assets/respiratory.css'
      - 'rpsgt-v3/assets/respiratory-trace-enhancements.css'
      - 'rpsgt-v3/assets/respiratory-timeline.css'
      - 'rpsgt-v3/core/respiratory-lab-engine.js'
      - 'rpsgt-v3/core/respiratory-signal-model.js'
      - 'rpsgt-v3/core/respiratory-timeline-engine.js'
      - 'rpsgt-v3/core/respiratory-timeline-ui.js'
      - 'rpsgt-v3/core/lab-respiratory.js'
      - 'rpsgt-v3/data/labs/catalog.json'
      - 'rpsgt-v3/scripts/test-respiratory-lab-system.mjs'
      - 'rpsgt-v3/scripts/test-respiratory-lab-shell.mjs'
      - 'rpsgt-v3/scripts/test-respiratory-signal-model.mjs'
      - 'rpsgt-v3/scripts/test-respiratory-timeline-lab.mjs'
      - 'rpsgt-v3/scripts/test-respiratory-timeline-shell.mjs'
      - '.github/workflows/rpsgt-v3-respiratory-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respiratory-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Respiratory Lab JavaScript syntax
        run: |
          node --check rpsgt-v3/core/respiratory-lab-engine.js
          node --check rpsgt-v3/core/respiratory-signal-model.js
          node --check rpsgt-v3/core/respiratory-timeline-engine.js
          node --check rpsgt-v3/core/respiratory-timeline-ui.js
          node --check rpsgt-v3/core/lab-respiratory.js
          node --check rpsgt-v3/scripts/test-respiratory-lab-system.mjs
          node --check rpsgt-v3/scripts/test-respiratory-lab-shell.mjs
          node --check rpsgt-v3/scripts/test-respiratory-signal-model.mjs
          node --check rpsgt-v3/scripts/test-respiratory-timeline-lab.mjs
          node --check rpsgt-v3/scripts/test-respiratory-timeline-shell.mjs
      - name: Validate respiratory pattern and progress engine
        run: node rpsgt-v3/scripts/test-respiratory-lab-system.mjs
      - name: Validate respiratory signal physiology
        run: node rpsgt-v3/scripts/test-respiratory-signal-model.mjs
      - name: Validate restored respiratory timeline model
        run: node rpsgt-v3/scripts/test-respiratory-timeline-lab.mjs
      - name: Validate respiratory learner shell and interactions
        run: node rpsgt-v3/scripts/test-respiratory-lab-shell.mjs
      - name: Validate restored respiratory timeline shell
        run: node rpsgt-v3/scripts/test-respiratory-timeline-shell.mjs
