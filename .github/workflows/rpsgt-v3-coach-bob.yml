name: Validate RPSGT v3 Coach Bob

on:
  push:
    branches:
      - build/rpsgt-v3-modular
      - main
    paths:
      - rpsgt-v3/core/coach-bob-engine.js
      - rpsgt-v3/core/guided-study-coach.js
      - rpsgt-v3/core/guided-study-coach-safety.js
      - rpsgt-v3/core/guided-study-question-actions.js
      - rpsgt-v3/core/guided-study-completion.js
      - rpsgt-v3/core/guided-study-storage-guard.js
      - rpsgt-v3/core/guided-trail-engine.js
      - rpsgt-v3/core/guided-trail-explorer.js
      - rpsgt-v3/core/study.js
      - rpsgt-v3/core/practice-coach.js
      - rpsgt-v3/core/practice-question-actions.js
      - rpsgt-v3/assets/guided-study-completion.css
      - rpsgt-v3/assets/guided-trail-explorer.css
      - rpsgt-v3/assets/practice-coach.css
      - rpsgt-v3/study.html
      - rpsgt-v3/practice.html
      - rpsgt-v3/scripts/test-coach-bob-engine.mjs
      - rpsgt-v3/scripts/test-guided-trail-system.mjs
      - rpsgt-v3/scripts/test-guided-trail-shell.mjs
      - rpsgt-v3/scripts/test-guided-study-completion-system.mjs
      - rpsgt-v3/scripts/test-guided-study-completion-shell.mjs
      - rpsgt-v3/scripts/test-practice-coach.mjs
      - rpsgt-v3/scripts/test-practice-shell.mjs
      - .github/workflows/rpsgt-v3-coach-bob.yml
  pull_request:
    branches:
      - main
    paths:
      - rpsgt-v3/core/coach-bob-engine.js
      - rpsgt-v3/core/guided-study-coach.js
      - rpsgt-v3/core/guided-study-coach-safety.js
      - rpsgt-v3/core/guided-study-question-actions.js
      - rpsgt-v3/core/guided-study-completion.js
      - rpsgt-v3/core/guided-study-storage-guard.js
      - rpsgt-v3/core/guided-trail-engine.js
      - rpsgt-v3/core/guided-trail-explorer.js
      - rpsgt-v3/core/study.js
      - rpsgt-v3/core/practice-coach.js
      - rpsgt-v3/core/practice-question-actions.js
      - rpsgt-v3/assets/guided-study-completion.css
      - rpsgt-v3/assets/guided-trail-explorer.css
      - rpsgt-v3/assets/practice-coach.css
      - rpsgt-v3/study.html
      - rpsgt-v3/practice.html
      - rpsgt-v3/scripts/test-coach-bob-engine.mjs
      - rpsgt-v3/scripts/test-guided-trail-system.mjs
      - rpsgt-v3/scripts/test-guided-trail-shell.mjs
      - rpsgt-v3/scripts/test-guided-study-completion-system.mjs
      - rpsgt-v3/scripts/test-guided-study-completion-shell.mjs
      - rpsgt-v3/scripts/test-practice-coach.mjs
      - rpsgt-v3/scripts/test-practice-shell.mjs
      - .github/workflows/rpsgt-v3-coach-bob.yml

jobs:
  validate-coach-bob:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Guided Study and Coach Bob module syntax
        run: |
          node --check rpsgt-v3/core/coach-bob-engine.js
          node --check rpsgt-v3/core/guided-study-coach.js
          node --check rpsgt-v3/core/guided-study-coach-safety.js
          node --check rpsgt-v3/core/guided-study-question-actions.js
          node --check rpsgt-v3/core/guided-study-completion.js
          node --check rpsgt-v3/core/guided-study-storage-guard.js
          node --check rpsgt-v3/core/guided-trail-engine.js
          node --check rpsgt-v3/core/guided-trail-explorer.js
          node --check rpsgt-v3/core/study.js
          node --check rpsgt-v3/core/practice-coach.js
      - name: Validate Coach Bob reasoning engine
        run: node rpsgt-v3/scripts/test-coach-bob-engine.mjs
      - name: Validate Guided Trail system
        run: node rpsgt-v3/scripts/test-guided-trail-system.mjs
      - name: Validate Guided Trail shell
        run: node rpsgt-v3/scripts/test-guided-trail-shell.mjs
      - name: Validate Guided Study completion system
        run: node rpsgt-v3/scripts/test-guided-study-completion-system.mjs
      - name: Validate Guided Study Coach Bob shell
        run: node rpsgt-v3/scripts/test-guided-study-completion-shell.mjs
      - name: Validate Practice Coach Bob
        run: |
          node rpsgt-v3/scripts/test-practice-coach.mjs
          node rpsgt-v3/scripts/test-practice-shell.mjs